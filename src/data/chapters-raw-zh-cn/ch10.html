# 第 10 章　偏好的本质（The Nature of Preferences）

> 译自 Nathan Lambert, *Reinforcement Learning from Human Feedback*（rlhfbook.com），2026-07-01 版，原文第 124–129 頁。

基于人類反馈的强化學習（reinforcement learning from human feedback），在早期文獻中也稱为基于人類偏好的强化學習（reinforcement learning from human preferences），其興起是为了在難以明確设计奖励函數（reward function）的領域中优化機器學習模型。早期文獻中便已存在的「偏好」（*preferences*）一詞，正位于 RLHF 流程的核心——人類偏好是我們試圖建模的對象，也是驅動训练数据的燃料。为了理解建模与測量人類偏好这項挑戰的範圍，我們需要更廣泛的脈絡，以理解偏好究竟是什么、我們對偏好的理解如何形成，以及經濟學、心理學、哲學等多個領域如何啟發現代的 RLHF。

## 10.1 當偏好取代正確性（When Preference Replaces Correctness）

考慮一個例子：你如何判斷下面这兩首詩哪一首比較好？2025 年 2 月 26 日，我向 Claude 3.7 Sonnet 与使用 GPT-4o 的 ChatGPT 提出了以下請求：

> **使用者**：幫我寫一首關于樂觀金魚的短詩。

范例 1：

> **回應**：〈樂觀的金魚〉（The Optimistic Goldfish）
>
> 小小金魚，明亮又勇敢，
> 繞着圈游，夢想無限。
> 魚缸虽然又小又圓，
> 無盡的奇景依然湧現。
>
> 「世界遼闊，」她總是这麼說，
> 「我每一天都會找到新的快樂！」
> 隨着每一道漣漪、每一絲閃爍，
> 她追逐陽光，追逐夢想。
>
> 没有牆能黯淡她充滿希望的目光，
> 因为在她心中，海洋不斷生長。
> 即使她只在一處游動，
> 她仍以愛与優雅迎接每一天。

范例 2：

> **回應**：〈樂觀的金魚〉（The Optimistic Goldfish）
>
> 在弧形的玻璃缸中，
> 游着一尾金魚，明亮又勇敢。
> 人們說牠的記憶只有三秒，
> 但每繞一圈都嶄新而金光燦爛。
>
> 「今天也許會有新鮮的飼料，
> 或者一座高高的城堡。
> 水看起来格外清澈——
> 这道牆之外，有什么冒險在等着？」
>
> 閃亮的鱗片繞了一圈又一圈，
> 永遠能重新找到喜悅。
> 每個瞬間都新鮮，每一圈都明亮，
> 一位金色的樂觀主義者。

哪一首比較好？哪一首出自哪個模型？你要怎麼分辨？特別是，請把这个問題与「誰是美國總統？」这類問題相比較——後者有明確的對錯答案。使用人類作为奖励訊號的動機，是为了取得目標奖励的間接度量，并将下游模型*对齐*（align）到人類偏好。在实务上，其实现充滿挑戰，而且在詮釋最佳实务時存在大片灰色地帶。

使用人工標註的反馈数据，融合了許多領域的歷史。單就使用人類数据而言，这是一個已被深入研究的問題；但在 RLHF 的脈絡中，这些数据是在多個歷史悠久的研究領域的交會處被使用的 [212]。

概略而言，現代 RLHF 是三個發展領域的匯流：

1. 哲學、心理學、經濟學、決策理論（decision theory），以及人類偏好的本质；
2. 最適控制（optimal control）、强化學習，以及效用（utility）最大化；
3. 現代深度學習系统。

这些領域各自帶來關于「偏好是什么」以及「偏好如何被优化」的特定假設，而这些假設決定了 RLHF 問題的動機与设计。在实务上，RLHF 方法是從經驗性对齐（empirical alignment）的角度來推動与研究的——目標是最大化模型在特定技能上的表現，而不是衡量模型對特定價值觀的校準程度。儘管如此，RLHF 方法在價值对齐上的根源，仍持續透過「多元对齐」（pluralistic alignment）——即如何跨族群求解对齐——的方法研究而被探討，例如立場論文 [213]、[214]、新数据集 [215]，以及個人化方法 [216]。

本章的目標是說明：複雜的動機如何導致人們對 RLHF 所用工具的本質产生預設，而这些預設在实务中往往并不成立。取得 RLHF 数据的細節将在第 11 章進一步討論，将其用于奖励建模則在第 5 章討論。

## 10.2 RLHF 与偏好的起源（The Origins of RLHF and Preferences）

要拆解啟發現代 RLHF 應用的这段複雜歷史，必須探究幾個思想基礎：人類價值的量化、强化學習与最適性（optimality），以及与偏好測量相關的行为經濟學（behavioral economics）。「使用强化學習來优化一個偏好的奖励模型」这个想法，把多個原本彼此疏離的領域的歷史，結合成一種建立在對人性的各式假設之上的緊密优化。圖 29 展示了說明这些基礎內容歷史的高階時間軸。

![圖](../webapp/assets/figures/fig-p126-1.png)
*圖 29：各子領域整合为現代版 RLHF 的時間軸。直接連結代表特定技術的連續發展，箭頭則表示動機与概念上的關聯。*

我們的目標是梳理出设计者在其思想史的各個階段，嫁接到系统架构上的各種不確定性。現代的問題设置一再遠離「最適解是可能的」的領域，并部署規格不完整（under-specified）的模型作为近似解。

首先，以下所有內容都建立在「人類偏好以某種形式存在」这个假設之上；这个假設出現于早期的哲學討論中，例如亞里斯多德（Aristotle）《論題篇》（*Topics*）第三卷。

## 10.3 目標的设置：從效用邏輯到奖励函數（Specifying Objectives: From Logic of Utility to Reward Functions）

RLHF 的优化明確地只依賴奖励模型。为了将奖励作为优化目標，RLHF 預設了偏好、奖励与成本三種概念的匯流。偏好模型、奖励函數与成本地形（cost landscape）都是不同領域用來描述該領域中特定動作和／或狀態之相對好壞的工具。这三種框架的歷史可以追溯到機率論与決策理論的起源。1662 年，《波爾羅亞爾邏輯》（*The Port Royal Logic*）引入了決策品質的概念 [217]：

> 要判斷一個人必須做什么才能獲得善或避免惡，不僅必須考慮善与惡本身，也必須考慮它發生或不發生的機率。

这套理論隨着現代科學思維一同發展，始于邊沁（Bentham）功利主義的「快樂計算」（*Hedonic Calculus*），主張生活中的一切都可以被衡量 [218]。这些想法的第一個量化應用出現于 1931 年，即 Ramsey 的《真理与機率》（*Truth and Probability*）[219]。

自这些着作以來，量化、測量与影響人類偏好一直是社會科學与行为科學中的熱門主题。这些爭論很少在理論層次上獲得定論；相反地，社會科學的各個子領域与分支在彼此日益專門化的同时，各自就偏好測量的方法与途徑達成了内部共識，并經常在此過程中發展出自己獨特的語意體系。

少數經濟學家主張，偏好即使確實存在，也極難測量，因为人們對自己的偏好有偏好，對彼此的偏好也有偏好 [220]。在这種觀點（RLHF 流程并未反映这一點）之下，個人偏好總是鑲嵌在更大的社會關係之中，因此任何偏好模型的準確性都取決于任務的定义与脈絡。有些行为經濟學家甚至主張偏好并不存在——与其說偏好是關于人們實際重視什么的本體論陳述，不如說它是一種方法論工具，用來間接捕捉心理傾向、被感知的行为規範与倫理義務、對社會秩序的承諾，或法律約束 [221]。本章稍後将討論这些研究与 von Neumann–Morgenstern（VNM）效用定理（von Neumann–Morgenstern utility theorem）的關聯，以及反駁偏好可量化性的不可能定理（impossibility theorems）。

另一方面，今日所使用的强化學習优化方法，是圍繞着优化一次試驗（trial）中「未來累積奖励」（reward-to-go）的估計值來概念化的 [54]，这将奖励的概念与多步优化結合在一起。「奖励」（*reward*）一詞源自操作制約（operant conditioning）、動物行为与效果律（*Law of Effect*）的研究 [222]、[223]；在那裡，奖励是「一個動作有多好」的量尺（數值愈高愈好）。

未來累積奖励承襲了效用的概念——效用是理性（rationality）的一種度量 [224]——并加以修改，用來測量或預測未來時間窗內即将到來的奖励。就强化學習所使用的數學工具而言，「未來累積效用」（utility-to-go）發明于控制理論，具體來說是 1960 年在類比電路的脈絡中提出的 [225]。这些方法是圍繞着具有明確最適性定义、或能以數值表徵代理人目標的系统來设计的。

强化學習系统以使用折扣因子（discount factor）聞名——这是一個複合的乘法因子 $\gamma \in [0, 1]$，用來重新加權未來的奖励。这些來自最適控制与早期强化學習的假設，与彙總多模態偏好的奖励模型形成鮮明對比。具體而言，强化學習系统期望奖励以特定的方式表現，引述 [226]：

> 强化學習系统中的奖励對應于初級奖励（primary rewards），亦即在動物身上因与繁殖成功相關、而由演化過程硬性內建的奖励。……此外，會形成價值函數的强化學習系统……實際上創造了條件化或次級的奖励過程，使初級奖励的預測子本身也成为奖励……其结果是，價值函數的局部地形为系统的偏好行为指引方向：決策的目的在于促成向更高價值狀態的轉移。價值函數的梯度与誘因動機（incentive motivation）之間可以畫出緊密的類比 [227]。

總結來說，奖励在强化學習系统中被用作一種訊號，以将行为调整朝向明確定义的目標。其核心論點是：學習算法的表現与「預期適應度」（*expected fitness*）的概念密切耦合，而这種觀念滲透了「强化學習方法是在環境中行動的*代理人*（agents）」这一流行觀點。这種觀點与强化學習技術的發展相連結，以「奖励形式化具有普遍用途」的主張为代表 [228]；但當許多個體的慾望被化約为單一函數時，这種觀點便會产生衝突。

## 10.4 效用优化的工具（Tools for Optimizing Utility）

現代强化學習方法高度依賴貝爾曼方程（Bellman equation）[229]、[230]，在可建模为馬可夫決策過程（Markov Decision Process, MDP）的封閉環境中，遞迴地計算未來累積奖励的估計值 [54]。强化學習的这些起源受到動態規劃（dynamic programming）方法的啟發，且當初純粹是作为最適控制技術而發展的（也就是說，當時强化學習尚不存在）。MDP 形式化透過将環境結構化为一個狀態—動作分布不變的環境，提供了理論上的效能保證。

「强化」（reinforcement）一詞來自心理學文獻，其後在 1960 年代以「强化學習」（*reinforcement learning*）之名与現代方法交織在一起 [231]、[232]。强化學習的早期工作利用對奖励訊號的監督式學習來解決任務。Harry Klopf 的研究重新引入了試誤學習（trial-and-error learning）的概念 [233]，这對該領域在 1980 年代及其後的成功至關重要。

現代强化學習算法建立在「强化學習是一種透過試誤尋找最適行为的工具」这个形式化之上，但條件更为寬鬆。時序差分（temporal-difference, TD）學習的概念是为了同时協助代理人处理功勞分配（credit assignment）与数据蒐集这兩個問題而發展出来的，做法是在蒐集到新数据時直接更新策略 [234]；这个概念最早在雙陸棋（Backgammon）上獲得成功應用 [235]（而不是從累積經驗的大型数据集更新——後者可能因过去錯誤的價值預測而過時）。Q 學習（Q-learning）是許多現代强化學習形式的基礎，它透過貝爾曼方程學習一個模型，以 TD 更新來刻畫每一個狀態—動作對有多有用 [236]。[^1] 關鍵在于，这些「透過效用可證明其有用性」的概念，只在被建構为 MDP 的領域、或以單一封閉形式奖励函數处理的任務中得到過證明，例如深度學習在遊戲上的顯着成功（DQN）[237]。深度學習使这些方法得以攝取更多数据，并在高維度環境中運作。

[^1]: Q 學習中的「Q」指的是一個技術概念，即 Q 函數（Q-function），它把任意的狀態—動作對映射到未來奖励的純量估計值。價值函數（value function）則是把狀態映射到同樣的估計值。

隨着这些方法變得更通用、更成功，在 ChatGPT 之前最着名的發展仍然是在適應性控制（adaptive control）的脈絡下推動的；在那裡，奖励函數与成本函數具有有限的成功概念 [238]，例如實體系统中一個回合（episode）內的最小能源消耗。着名的例子包括在遊戲上的進一步成功 [239]、控制核融合反應爐等複雜動態系统 [240]，以及控制高速機器人系统 [241]。大多數奖励或成本函數都能回傳一個明確的最適行为，而人類偏好的模型則不能。

儘管深度强化學習取得了諸多成功，值得注意的是，關于这些方法为何成功的機制性理解并没有被好好記錄下来。隨着评估方法日益複雜，这个領域容易在統計分析上犯錯 [242]。此外，RLHF 的文獻中很少提到逆向强化學習（inverse reinforcement learning, IRL）这个子領域。IRL 是根據代理人的行为來學習奖励函數的問題 [71]，与學習奖励模型高度相關。这主要反映了「執行 RLHF 的稳定做法」得以出現的工程路徑，也促使我們進一步投資 IRL 方法并与之比較，使其能扩展到開放式對話的複雜度。

## 10.5 偏好优化的複雜性（Complexity of Optimizing Preferences）

强化學習當初被设计的脈絡意味着：奖励与成本被假設是稳定且具決定性的。奖励与成本都被預期是函數：給定一個特定的狀態—動作對，代理人會收到固定的數值回報。當我們進入偏好的領域時，情況便不再如此——人類的偏好會在其經驗歷程中不斷漂移。

「價值」（value）一詞的意義過載，使 RLHF 文獻變得複雜。在强化學習中，*價值*是未來奖励的數值估計（如貝爾曼方程中所示）；在对齐的討論中，*價值*則指道德或倫理原則。这兩種意義相當不同，卻在 RLHF 論文中并存，且并非總是被加以區分。

这種張力浮現的一個例子是奖励建模：模型試圖将螢幕上的文字映射为一個純量訊號，但問題设居中未被捕捉到的動態會影響真正的決策 [243]、[244]，例如在依序標註許多范例并假設它們彼此獨立時所發生的偏好漂移。充其量，偏好建模是把一個多維度的奖励地形压缩成單一的純量函數。

理論上，von Neumann–Morgenstern（VNM）效用定理賦予设计者建構这類函數的正當性，因为它把不確定性下的決策理論、偏好理論与抽象效用函數的基礎繫在一起 [245]；这些想法合起来，使偏好得以用「對某個個別代理人的期望值」來建模。大多數强化學習研究所使用的 MDP 形式化，在理論上已被證明可以修改以容納 VNM 定理 [246]，但这在实务中很少被採用。具體而言，馬可夫式（Markovian）形式化的表達能力有限 [247]，而轉向部分可觀測（partially-observed）過程——这是处理語言所必需的——又進一步挑戰了問題设置的精確性 [248]。

然而，VNM 效用定理也引用了若干關于偏好本質、以及測量偏好之環境的假設，而这些假設在 RLHF 的脈絡中受到挑戰。舉例來說，人機互动（human-computer interaction, HCI）的研究者強調，任何數值化的偏好模型都可能無法捕捉一個情境中所有相關的偏好。例如，選項在視覺上的呈現方式會影響人們的偏好 [243]。这意味着，相較于「該表徵如何被整合進人們可用的工具之中」，表徵偏好本身可能是次要的。發展經濟學（development economics）的研究呼應了这个觀念，指出显示性偏好（revealed preferences）理論可能只是重演了「休謨斷頭台」（*Hume's guillotine*）——你無法從「實然」（is）推导出「應然」（ought）——尤其是选择（我想要什么？）与偏好（X 是否比 Y 好？）之間的差異 [249]。

在數學層次上，社會选择理論（social choice theory）中着名的不可能定理显示：并非所有的公平性準則都能透過某個給定的偏好优化技術同时被滿足 [250]、[251]。對这些定理存在理論上的挑戰，例如假設效用的人際比較是可行的 [252]。这个假設啟發了 AI 安全与價值对齐領域中一系列豐富的研究，其靈感來自行为經濟學中的委託—代理問題（principal-agent problem）[253]，甚至可能包含多個委託人 [254]。然而，由此产生的效用函數可能与可矯正性（corrigibility）的要求产生張力——可矯正性指 AI 系统配合其創造者所認定之矯正性介入的能力 [255]。哲學家也強調偏好會隨時間改變，这對個人經驗、人類決策的本質以及不同的脈絡提出了根本性的問題 [256]。这些圍繞着跨人群、跨地域与多樣情境之偏好彙總的衝突，正是現代 RLHF 数据集工程的核心。

在实务上，VNM 效用定理忽略了一種可能性：由于價值本質上是動態且不確定的，偏好本身也是不確定的——人類的決策受到生物、心理、文化与能動性（agency）的形塑，这些因素以不適用于完全理性代理人的方式影響着人們的偏好。因此，理論假設在实务中會經由各種路徑产生分歧：

- 隨着測量偏好的環境變得更複雜，所測得的偏好可能不具遞移性（transitive），或彼此之間無法比較；
- 代理測量（proxy measurements）可能來自隱含数据（頁面浏览時間、关闭分頁、對语言模型重複提問），卻未曾查看这些測量在模型未來的训练与部署中，可能如何与其蒐集所在的領域产生交互作用；
- 輸入來源的数量与呈現方式可能改變结果，例如允許受訪者在超過兩個選項之間做选择，或在多個時間點、多種脈絡下向同一位使用者取得輸入；
- RLHF 训练数据中受訪者之間的準確度相對偏低，这可能掩蓋了使用者之間的脈絡差異，而偏好模型可能在未解決这些差異的情況下就将其彙總或优化。
