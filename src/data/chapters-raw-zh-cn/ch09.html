# 第 9 章　拒绝采样（Rejection Sampling）

> 译自 Nathan Lambert, *Reinforcement Learning from Human Feedback*（rlhfbook.com），2026-07-01 版，原文第 117–123 頁。

拒绝采样（Rejection Sampling, RS）是偏好微调（preference fine-tuning）中使用最廣泛、卻也最缺乏文獻記載的方法之一。許多重要的 RLHF 論文都将它作为训练管線的核心組成部分，但至今仍不存在一個標準（canonical）的实现，也没有人解釋過它为什么如此有效。拒绝采样可以應用在训练管線的多個節點——指令微调之后、基于 RL 的优化之后、甚至 RLVR 之后——这使它成为一個用途廣泛但難以歸類的工具。加上文獻記載不足的特性，这正是它被安排在核心优化方法末尾介紹的原因。

拒绝采样的運作方式是：先蒐集新的候選補全（completion），根據一個已训练好的奖励模型（reward model）加以篩選，然后只用其中最好的補全來微调原始模型（使用与指令微调相同的損失函數）。

这个名稱源自計算統計學（computational statistics）[209]：當人們想從一個複雜的分布中采样、卻没有直接的方法時，可以改從一個較容易建模的分布中采样，并使用一個啟發式規則（heuristic）來检查樣本是否可以接受。對應到语言模型上，目標分布是「對提示（prompt）的高品質補全」，篩選器是奖励模型，而采样分布則是當前的模型。

WebGPT [4]、Anthropic 的 Helpful and Harmless 代理人 [5]、OpenAI 着名的過程奖励模型（process reward models）論文 [50]、Llama 2 Chat 模型 [49]，以及其他開創性研究，全都使用了这个基準方法；較近期的研究則将它直接形式化——例如将其應用于多模態对齐的 RAFT [210]，以及 Statistical Rejection Sampling Optimization（RSO）[211]，後者從原理層面概述了拒绝采样与其他偏好學習目標之間的關係。

*在本章中，我們一律以 $x$ 表示提示、以 $y$ 表示補全。这種記號在语言模型文獻中很常見——这些方法操作的是完整的「提示–補全」對，而非個別 token。*

## 9.1 训练流程逐步解析（Training Process, Step by Step）

拒绝采样整體上遵循幾個階段。

0. **选择提示与奖励模型（Prompt and reward model selection）**：首先，你必須選定要训练的提示集，并考量它与训练其他階段的相對關係。最簡單的方法是重複使用第一個 SFT/IFT 階段中的所有提示，但这可能造成一定程度的过度擬合（overfitting）。在进行拒绝采样之前，你也必須已经训练好一個奖励模型（詳見第 5 章）。
1. **從起始检查點生成補全（Generate completions from the starting checkpoint）**：接着，必須用想要优化的模型，對選定的提示生成補全。这可能涉及调整許多设置，例如采样溫度（temperature）、top-p、最大序列長度、每個提示的補全数量等。
2. **用奖励模型選出最佳補全（Select top completions with a reward model）**：所有補全都由奖励模型进行排序。这个階段也可能包含去重（deduplication），使每個提示只保留一個補全；不過許多这類设计決策最終都取決于實證上的消融实验（ablation studies）。
3. **對最佳補全进行 SFT（SFT on top completions）**：最后一步，是以選出的補全對起始检查點进行指令微调，完成整個拒绝采样流程。

至于實際該使用哪些提示、如何挑選奖励模型、拒绝采样該安排在什么順序等細節，文獻中并没有完善的記載。本章提供这些方法的概述，并把進一步的实验留給讀者。

### 9.1.1 生成補全（Generating Completions）

为了對每個提示生成多個候選補全，我們先将 $M$ 個提示的集合定义为一個向量：

$$
X = [x_1, x_2, ..., x_M] \tag{110}
$$

这些提示可以有許多來源，但最常見的是來自指令训练集。

對每個提示 $x_i$，我們生成 $N$ 個補全。我們可以把它表示成一個矩陣：

$$
Y = \begin{bmatrix}
y_{1,1} & y_{1,2} & \cdots & y_{1,N} \\
y_{2,1} & y_{2,2} & \cdots & y_{2,N} \\
\vdots & \vdots & \ddots & \vdots \\
y_{M,1} & y_{M,2} & \cdots & y_{M,N}
\end{bmatrix} \tag{111}
$$

其中 $y_{i,j}$ 表示第 $i$ 個提示的第 $j$ 個補全。每一列（row）$i$ 對應單一提示 $x_i$，包含它的 $N$ 個候選補全；每一行（column）$j$ 則對應所有提示中第 $j$ 次采样得到的補全。

### 9.1.2 为補全評分（Scoring Completions）

現在，我們把所有这些「提示–補全」對送進奖励模型，得到一個奖励矩陣。我們把奖励表示成矩陣 $R$：

$$
R = \begin{bmatrix}
r_{1,1} & r_{1,2} & \cdots & r_{1,N} \\
r_{2,1} & r_{2,2} & \cdots & r_{2,N} \\
\vdots & \vdots & \ddots & \vdots \\
r_{M,1} & r_{M,2} & \cdots & r_{M,N}
\end{bmatrix} \tag{112}
$$

每個奖励 $r_{i,j}$ 是把補全 $y_{i,j}$ 与其對應的提示 $x_i$ 一起送進奖励模型 $\mathcal{R}$ 計算而得：

$$
r_{i,j} = \mathcal{R}(y_{i,j} \mid x_i) \tag{113}
$$

要選出用于训练的最佳補全，有多種方法。

为了将「根據奖励矩陣選出最佳補全」这个過程形式化，我們可以定义一個作用在奖励矩陣 $R$ 上的選取函數（selection function）$S$。

#### 9.1.2.1 每個提示取最佳（Top Per Prompt）

第一種可能的選取函數，是對每個提示取奖励的最大值。

$$
S(R) = \left[\arg\max_{j} r_{1,j},\ \arg\max_{j} r_{2,j},\ ...,\ \arg\max_{j} r_{M,j}\right] \tag{114}
$$

这个函數 $S$ 回傳一個索引向量，其中每個索引對應 $R$ 中每一列奖励最大值所在的行。接着我們就能用这些索引選出我們要的補全：

$$
Y_{chosen} = [y_{1,S(R)_1},\ y_{2,S(R)_2},\ ...,\ y_{M,S(R)_M}] \tag{115}
$$

#### 9.1.2.2 整體最佳配對（Top Overall Pairs）

另一種做法是從整個集合中選出前 $K$ 個「提示–補全」對。首先，我們把奖励矩陣 $R$ 攤平（flatten）成單一向量：

$$
R_{flat} = [r_{1,1}, r_{1,2}, ..., r_{1,N}, r_{2,1}, r_{2,2}, ..., r_{2,N}, ..., r_{M,1}, r_{M,2}, ..., r_{M,N}] \tag{116}
$$

这个 $R_{flat}$ 向量的長度为 $M \times N$，其中 $M$ 是提示的数量，$N$ 是每個提示的補全数量。

現在，我們可以定义一個選取函數 $S_K$，選出 $R_{flat}$ 中 K 個最大值的索引：

$$
S_K(R_{flat}) = \text{argsort}(R_{flat})[-K:] \tag{117}
$$

其中 argsort 回傳能将陣列以遞增順序排序的索引，而我們取最后 $K$ 個索引，即得到 $K$ 個最大值。

要取得選出的補全，我們需要把这些攤平後的索引映射回原本的補全矩陣 $Y$。要还原對應的「提示–補全」對，可以把從零起算（zero-indexed）的攤平索引 $k$ 映射到 $(i, j)$：$i = \lfloor k/N \rfloor + 1$ 且 $j = (k \bmod N) + 1$。

#### 9.1.2.3 選取范例（Selection Example）

考慮以下情境：我們有五個提示和四個補全。我們将展示兩種根據奖励選取補全的方式。

$$
R = \begin{bmatrix}
0.7 & 0.3 & 0.5 & 0.2 \\
0.4 & 0.8 & 0.6 & 0.5 \\
0.9 & 0.3 & 0.4 & 0.7 \\
0.2 & 0.5 & 0.8 & 0.6 \\
0.5 & 0.4 & 0.3 & 0.6
\end{bmatrix} \tag{118}
$$

首先是**每個提示取最佳（per prompt）**。直觀上，我們可以将奖励矩陣標示如下：

$$
R = \begin{bmatrix}
\mathbf{0.7} & 0.3 & 0.5 & 0.2 \\
0.4 & \mathbf{0.8} & 0.6 & 0.5 \\
\mathbf{0.9} & 0.3 & 0.4 & 0.7 \\
0.2 & 0.5 & \mathbf{0.8} & 0.6 \\
0.5 & 0.4 & 0.3 & \mathbf{0.6}
\end{bmatrix} \tag{119}
$$

使用 argmax 方法，我們为每個提示選出最佳補全：

$$
S(R) = \left[\arg\max_{j} r_{i,j} \ \text{for} \ i \in [1,5]\right] \tag{120}
$$

$$
S(R) = [1, 2, 1, 3, 4] \tag{121}
$$

这表示我們會選出：

- 提示 1：補全 1（奖励 0.7）
- 提示 2：補全 2（奖励 0.8）
- 提示 3：補全 1（奖励 0.9）
- 提示 4：補全 3（奖励 0.8）
- 提示 5：補全 4（奖励 0.6）

接着是**整體最佳（best overall）**。我們把整體前五名的補全配對標示出来。

$$
R = \begin{bmatrix}
\mathbf{0.7} & 0.3 & 0.5 & 0.2 \\
0.4 & \mathbf{0.8} & 0.6 & 0.5 \\
\mathbf{0.9} & 0.3 & 0.4 & \mathbf{0.7} \\
0.2 & 0.5 & \mathbf{0.8} & 0.6 \\
0.5 & 0.4 & 0.3 & 0.6
\end{bmatrix} \tag{122}
$$

首先，我們把奖励矩陣攤平：

$$
R_{flat} = [0.7, 0.3, 0.5, 0.2, 0.4, 0.8, 0.6, 0.5, 0.9, 0.3, 0.4, 0.7, 0.2, 0.5, 0.8, 0.6, 0.5, 0.4, 0.3, 0.6] \tag{123}
$$

接着，我們選出五個最大值的索引：

$$
S_5(R_{flat}) = [8, 5, 14, 0, 11] \tag{124}
$$

把这些索引映射回原本的矩陣：

- 索引 8 → 提示 3、補全 1（奖励 0.9）
- 索引 5 → 提示 2、補全 2（奖励 0.8）
- 索引 14 → 提示 4、補全 3（奖励 0.8）
- 索引 0 → 提示 1、補全 1（奖励 0.7）
- 索引 11 → 提示 3、補全 4（奖励 0.7）

#### 9.1.2.4 实现范例（Implementation Example）

以下程式碼片段展示了这些選取方法可以如何实现。

```python
import numpy as np

x = np.random.randint(10, size=10)
print(f"{x=}")
sorted_indices = np.argsort(x)
x_sorted = x[sorted_indices]
print(f"{x_sorted=}")

# first way to recover the original array
i_rev = np.zeros(10, dtype=int)
i_rev[sorted_indices] = np.arange(10)
np.allclose(x, x_sorted[i_rev])

# second way to recover the original array
np.allclose(x, x_sorted[np.argsort(sorted_indices)])
```

### 9.1.3 微调（Fine-Tuning）

有了選出的補全之后，接着就對模型的當前版本執行標準的指令微调。更多細節可參閱指令微调的章节。

## 9.2 实现細節（Implementation Details）

執行这種训练的核心超參數都相當直觀：

- **采样參數（Sampling parameters）**：拒绝采样直接取決于從模型取得的補全。拒绝采样的常見设置包括大于零的溫度（例如介于 0.7 到 1.0 之間），并搭配對 top-p 或 top-k 采样等參數的其他调整。
- **每個提示的補全数量（Completions per prompt）**：成功的拒绝采样实现，通常對每個提示採 10 到 30 個或更多的補全。補全数量太少會使训练产生偏差（biased）且/或帶有雜訊（noisy）。
- **指令微调細節（Instruction tuning details）**：關于拒绝采样中指令微调階段的训练細節，尚未有明確的公開資訊。它們很可能使用与最初指令微调階段略有不同的设置。
- **異質模型生成（Heterogeneous model generations）**：某些拒绝采样的实现，會納入來自多個模型的生成结果，而不僅僅來自即将被训练的當前模型。这方面的最佳实务尚未確立。
- **奖励模型训练（Reward model training）**：所使用的奖励模型會對最終结果产生重大影響。關于奖励模型训练的更多資源，請參閱相關章节。

在进行批次的奖励模型推断時，可以将 token 化後的補全依長度排序，讓每個批次的長度相近。这能免去在大量填充（padding）token 上執行推断的需要，以少量的实现複雜度換取吞吐量的提升。

## 9.3 相關方法：Best-of-N 采样（Related: Best-of-N Sampling）

Best-of-N（BoN）采样是拒绝采样的近親：它遵循同樣「生成并評分」的程序，但你**不**用選出的補全去微调模型。相反地，BoN 是在推断時（inference time）針對一個固定的提示（或一組提示）計算可能的最佳補全；相關技術經常用于聊天模型的「Pro」級服务層——为了回答你的查詢而投入額外的运算量。

Best-of-N 采样經常被拿來作为 RLHF 训练方法的比較基準。務必記得，BoN *并不會*修改底層模型，它是一種采样技術。因此，在某些情境下，将 BoN 采样与 PPO 等線上训练方法做比較仍然是有效的。例如，你仍然可以在執行 BoN 采样時，衡量它相对于任何其他策略（policy）的 KL 距離。

在这裡，我們将說明：當對單一提示使用簡單的 BoN 采样時，前面展示的兩種選取準則是等價的。

令 $R$ 为我們單一提示搭配 $N$ 個補全的奖励向量：

$$
R = [r_1, r_2, ..., r_N] \tag{125}
$$

其中 $r_j$ 表示第 j 個補全的奖励。

使用 argmax 方法，我們为該提示選出最佳補全：

$$
S(R) = \arg\max_{j \in [1,N]} r_j \tag{126}
$$

而使用 top-K 方法并取 $K = 1$，就會化約成同一種方法——这是常見的做法。

## 9.4 建議实验（Suggested Experiments）

`code/rejection_sampling/` 中的配套实现會執行一個完整的 GSM8K 拒绝采样管線：生成 rollout、用奖励模型評分、選出训练子集、微调，并以精確匹配（exact-match）準確率进行评估。四個设置檔被安排成互相配對的实验組／對照組，讓讀者可以檢驗奖励模型是否真的有幫助。

1. **先建立一次 rollout 快取。**

```
cd code/
uv run python -m rejection_sampling.preprocess \
    --config rejection_sampling/configs/top_per_prompt.yaml
```

这會为共用的 GSM8K 切片生成補全并評分。只要生成与評分的设置保持不變，後續的训练设置檔都會重複使用这份快取。

2. **将奖励選取与隨機對照組做比較。**

```
cd code/
uv run python -m rejection_sampling.train \
    --config rejection_sampling/configs/top_per_prompt.yaml
uv run python -m rejection_sampling.train \
    --config rejection_sampling/configs/random_per_prompt.yaml
uv run python -m rejection_sampling.train \
    --config rejection_sampling/configs/top_k_overall.yaml
uv run python -m rejection_sampling.train \
    --config rejection_sampling/configs/random_k_overall.yaml
```

   以配對的方式解讀结果：`top_per_prompt` 對比 `random_per_prompt`，以及 `top_k_overall` 對比 `random_k_overall`。如果由奖励選取的那組跑不贏它的隨機基準，就表示奖励模型或采样出的補全在該数据切片上并未提供有用的訊號。

3. **调整奖励模型可以挑選的空間大小。** 复制一份设置檔，修改 `num_completions_per_prompt`、`temperature`、`top_p` 与 `selection.top_k`。更多的補全可以提高「可得的最佳樣本」的品質，但前提是奖励模型有能力區分好答案与壞答案。

4. **嘗試較小的策略模型。** 将 `model_name` 設为一個較小的相容指令模型，降低 `max_train_samples`，然后重新執行同樣的配對实验。这能讓实验成本更低，并凸顯出拒绝采样究竟是在拯救較弱的生成结果，还是只是在一群本來就不錯的结果中做挑選。
