# 第 16 章　评估（Evaluation）

> 译自 Nathan Lambert, *Reinforcement Learning from Human Feedback*（rlhfbook.com），2026-07-01 版，原文第 184–192 頁。

评估（evaluation）是一組用來理解本書所述训练流程之品質与影響的技術。评估通常以基準（benchmark）的形式呈現（常見基準的例子包括 MMLU、GPQA、SWE-Bench、MATH 等），这些基準是一組離散的問題集或環境，设计來衡量模型的某項特定性質。评估是一種持續演進的方法論，因此我們将呈現 RLHF 領域中评估的近期各個「季節」，以及那些會延續到语言模型建模未來的共同主题。理解语言模型评估——尤其是后训练（post-training）階段的评估——的關鍵在于：當前流行的评估體制，其實反映了流行的训练最佳实务与目標。虽然具挑戰性的评估會推動语言模型進入新的領域，但大多數评估的设计目的，是为新模型建立有用的訊號。

在許多方面，本章的设计是呈現 RLHF 早期歷史中各種流行评估體制的縮影（vignettes），讓讀者能夠理解其中的共同主题、細節与失效模式。

RLHF 与后训练的评估在其早期歷史中經歷了幾個明顯不同的階段：

1. **早期聊天階段（Early chat-phase）**：早期以 RLHF 或偏好微调（preference tuning）训练的模型，其目標评估聚焦于捕捉模型的聊天表現，特別是相对于已知的強大模型（如 GPT-4）而言。早期的例子包括 MT-Bench [78]、AlpacaEval [79] 与 Arena-Hard [80]。这些基準以「LLM 作为評審」（LLM-as-a-judge）取代人類评估者，使用像 GPT-4 这樣的模型來为回應評分——这是一種扩展人類评估標準的高性價比方式（見第 12 章）。當時模型的评估範圍狹窄，而这些領域如今被視为「聊天（chat）」或「指令遵循（instruction following）」領域。
2. **多技能時代（Multi-skill era）**：隨着時間推移，普遍的实务確立了 RLHF 可以用來提升聊天以外的更多技能。舉例來說，Tülu 评估套件涵蓋了知識類任務（MMLU [359]、PopQA [360]、TruthfulQA [361]）、推理類（BigBenchHard [362]、DROP [363]）、數學類（MATH [364]、GSM8K [76]）、程式撰寫類（HumanEval [365]、HumanEval+ [366]）、指令遵循 [260]，以及安全性（由多項评估組合而成）。这反映了后训练被擁抱为一種超越安全与聊天、面向多方面的解決方案的領域。
3. **推理与工具（Reasoning & tools）**：后训练的當前時代，其定义是聚焦于具挑戰性的推理与工具使用問題。这些包括困難得多的知識密集型任務，如 GPQA Diamond [367] 与 Humanity's Last Exam [368]；複雜精細的軟體工程任務，如 SWE-Bench+ [369] 与 LiveCodeBench [370]；或以近年 AIME 競賽为代表的高難度數學問題。

在此之外，新的領域仍将持續演化。隨着 AI 越來越成为一個工業化的領域，评估的誘因正在轉變，并變得多方利害關係人化（multi-stakeholder）。自 ChatGPT 發布以來，私有评估（如 Scale Leaderboard [371]）、社群驅動的评估（如 Arena [258]），以及第三方评估公司（如 Artificial Analysis 与 Epoch AI）不斷激增。在本章中，我們将納入對應这些评估如何被实现与理解的細節。

## 16.1 提示格式（Prompting Formatting）

**提示（Prompting）**语言模型本身是一個簡單的動作，也是相當自然的行为，但它同时被視为一門可以練習与精進的技藝或藝術 [372]。提示（prompt）是为语言模型組織資訊与脈絡（context）的方式。对于常見的互动而言，提示相對基本。对于進階情境，一個精心设计的提示可能決定某個特定一次性使用案例的成敗。

在评估方面，提示技巧可以對模型的表現产生重大影響。某些提示技巧——例如下文討論的格式化（formatting）——可能使模型的表現從 60% 掉到接近 0。同樣地，改變提示可以在训练期間幫助模型學得更好。通俗地說，把模型提示得好，可以帶來如同使用未來模型般的主觀体验，解锁超出正常使用範圍的效能。

提示所帶來的增益，通常小于改善数据或训练算法等核心領域，但在最終產品中仍可能相當可觀。更重要的啟示是：當你训练一個強大的、領先的模型時，把它弄壞并使效能暴跌，比找到多一點點效能要容易得多。

用現代语言模型好好地提示，可能涉及準備一整份供模型回應的報告（往往包含數千個 token 的生成文字）。这種行为模式，是语言模型效能衡量与理解方式的諸多變化所帶來的下游结果。

### 16.1.1 少樣本提示与對數似然評分（Few-Shot Prompting and Log-Likelihood Scoring）

早期的语言模型只被當作智慧型的自動補全（autocomplete）工具使用。为了以更開放的方式使用这些模型，人們會先向模型展示多個范例，接着給出一個不完整片語形式的提示。这被稱为少樣本學習（few-shot learning）或情境內學習（in-context learning）[63]，而當時指令微调（instruction tuning）或 RLHF 尚未參与其中。以流行的评估來說，形式如下：

```
# Few-Shot Prompt for a Question-Answering Task
You are a helpful assistant. Below are example interactions to guide your style:

### Example 1
User: "What is the capital of France?"
Assistant: "The capital of France is Paris."

### Example 2
User: "Who wrote the novel '1984'?"
Assistant: "George Orwell wrote '1984.'"

# Now continue the conversation using the same style.
User: "Can you explain what a neural network is?"
Assistant:
```

*（范例說明：这是一個問答任務的少樣本提示。開頭告知模型「你是一個樂于助人的助理」，接着給出兩個范例互动——「法國的首都是什么？」「法國的首都是巴黎。」以及「小說《1984》的作者是誰？」「喬治・歐威爾寫了《1984》。」——最后要求模型以相同風格回答新問題「你能解釋什么是神經網路吗？」）*

在这裡，有多種方式可以评估答案。如果我們考慮一個 MMLU 風格的問題，模型必須在多個答案之間做选择：

```
# Few-Shot Prompt

Below are examples of MMLU-style questions and answers:

### Example 1
Q: A right triangle has legs of lengths 3 and 4. What is the length of its hypotenuse?
Choices:
(A) 5
(B) 6
(C) 7
(D) 8

Correct Answer: (A)

### Example 2
Q: Which of the following is the chemical symbol for Sodium?
Choices:
(A) Na
(B) S
(C) N
(D) Ca

Correct Answer: (A)

### Now answer the new question in the same style:

Q: Which theorem states that if a function f is continuous on a closed interval [a,b],
then f must attain both a maximum and a minimum on that interval?
Choices:
(A) The Mean Value Theorem
(B) The Intermediate Value Theorem
(C) The Extreme Value Theorem
(D) Rolle's Theorem

Correct Answer:
```

*（范例說明：这是 MMLU 風格的少樣本提示。范例 1 問「一個直角三角形的兩股長为 3 与 4，斜邊長是多少？」正確答案为 (A) 5；范例 2 問「下列何者是鈉的化學符號？」正確答案为 (A) Na；最后要求模型以相同格式回答新問題「哪個定理指出：若函數 f 在閉區間 [a,b] 上連續，則 f 必在該區間上同时達到最大值与最小值？」選項为 (A) 均值定理、(B) 中间值定理、(C) 極值定理、(D) 羅爾定理。）*

要讓语言模型在这裡給出答案，可以依照某些取樣參數生成一個 token，然后检查答案是否正確——A、B、C 或 D（上述格式如 [373] 所提出的形式），也可以查看每個 token 的對數機率（log-probabilities），并在正確答案的機率較高時将該任務標記为正確。

讓我們稍微深入探討这些评估細節。前者在單次嘗試時通常稱为精確匹配（exact match），在彙總多個樣本時稱为多數決投票（majority voting）（pass@k 是程式撰寫评估中测试功能正確性時的類比指標）；後者的方法則稱为（條件式）對數似然（log-likelihood）評分，其中條件是提示本身。核心差異在于：從底層機率分布取樣本質上會引入隨機性，而模型輸出于其 token 上的對數機率是靜態的（忽略微小的數值差異時）。

對數似然評分有兩種潛在的实现方式——第一種是查看字母「(A)」的機率，第二種是查看答案文字「The Mean Value Theorem」的機率。兩者都是可接受的指標，但預測答案的字母，遠比預測一個完整的、可能跨越多個 token 的答案機率來得簡單。對數似然評分在預训练（pretraining）评估中較常見，因为此時模型缺乏精確匹配所需的問答格式；而精確匹配則是后训练的標準做法 [18]。

精確匹配有不同的問題，例如需要固定的格式後綴（如 `The answer is:`），或使用正規表示式（regular expressions）在生成文字中的任意位置偵測答案（例如尋找 `(C)` 或答案字串本身）。如果评估格式与模型的生成方式不匹配，分數可能暴跌。语言模型的评估最好在格式不構成瓶頸的情況下进行，如此才能测试模型的完整能力。实现格式無關（format-agnostic）的评估需要大量的努力与反覆調校才能做對，而这在实务上相當罕見。

回到评估的歷史。無論使用上述哪種设置，少樣本提示的一個常見挑戰是模型不遵循格式，而这會被計为錯誤答案。在设计评估領域時，情境內（in-context）使用的范例数量通常被視为一個设计參數，範圍從 3 到 8 個或更多。

### 16.1.2 思維鏈提示（Chain-of-Thought Prompting）

在少樣本提示的演進過程中，出現了納入思維鏈（chain-of-thought）范例供模型仿效的想法。其形式是：情境內范例中包含寫出来的推理過程，如下所示（这種做法後來被明確提示模型生成推理步驟的方式所取代）[374]：

```
# standard prompting
Q: Roger has 5 tennis balls. He buys 2 more cans of tennis balls. Each can has 3 tennis
balls. How many tennis balls does he have now?

A: The answer is 11.

Q: The cafeteria had 23 apples. If they used 20 to make lunch and bought 6 more, how
many apples do they have?

A: The answer is ...

# chain-of-thought prompting
Q: Roger has 5 tennis balls. He buys 2 more cans of tennis balls. Each can has 3 tennis
balls. How many tennis balls does he have now?

A: Roger started with 5 balls. 2 cans of 3 tennis balls each is 6 tennis balls. 5 + 6 =
11. The answer is 11.

Q: The cafeteria had 23 apples. If they used 20 to make lunch and bought 6 more, how
many apples do they have?

A: The cafeteria had 23 apples originally. They..
```

*（范例說明：上半部是標準提示——問「Roger 有 5 顆網球，又買了 2 罐網球，每罐有 3 顆，他現在共有幾顆？」范例答案直接寫「答案是 11」；下半部是思維鏈提示——范例答案改为寫出推理過程「Roger 一開始有 5 顆球。2 罐、每罐 3 顆網球共 6 顆。5 + 6 = 11。答案是 11。」如此一來，模型在回答新問題「餐廳原本有 23 顆蘋果，用了 20 顆做午餐，又買了 6 顆，現在有幾顆？」時，也會先寫出推理步驟「餐廳原本有 23 顆蘋果。他們……」）*

### 16.1.3 零樣本指令遵循（Zero-Shot Instruction Following）

隨着時間推移，语言模型變得更強，评估也演進为零樣本（zero-shot）评估，亦即所謂的「零樣本學習者（zero-shot learners）」[65]。Finetuned Language Net（FLAN）證明了在特定任務上微调的语言模型——作为現代指令微调的先驅——能夠泛化到它們未曾训练過的零樣本問題 [65]（T0 [66] 也有類似的發現）。这是指令微调（instruction fine-tuning, IFT）的興起，它是 RLHF 与后训练的重要先驅。一個零樣本問題看起来會像这樣：

```
User: "What is the capital of France?"
Assistant:
```

*（范例說明：使用者直接問「法國的首都是什么？」不提供任何范例，等待助理作答。）*

從 2022 年的这个時間點開始，時間軸開始納入早期 RLHF 的關鍵作品，例如 InstructGPT。伴隨这些模型而來的核心能力与使用案例轉變，是更加開放式的使用。隨着使用方式更開放，透過從模型取樣进行评估的做法日益流行，因为它反映了實際的使用情況——技術上，这可以稱为基于生成的（generation-based，精確匹配）评估，但它并没有那麼明確的公認術語。在 ChatGPT 之后直到近幾年的这段期間，一些多選題评估仍被用于 RLHF 研究，因为任何朝向共同实务的轉變都需要相當長的時間才會展开，通常是一年以上（例如这類评估的做法是：将溫度（temperature）設为零，并取樣字元 A、B、C 或 D）。

### 16.1.4 推理時代的评估提示（Reasoning-Era Evaluation Prompts）

隨着 2024 年底与 2025 年初推理模型（reasoning models）的興起，模型行为的一項重大變化，是在每個答案之前加入一段長的思維鏈（Chain-of-Thought, CoT）推理過程。这些模型不再需要以 [375] 所提出的經典語句「think step by step」（一步一步思考）來提示。评估实务的下一階段演進，是搭配思維鏈推理的基于生成（精確匹配）评估（因此为了最佳效能，幾乎總是使用大于零的溫度）。

舉例來說，在某些设居中，每個問題或類別都有專門设计的提示，以協助從模型中引出行为。Tülu 3 是一篇早期的重要論文，詳細記錄了一些用于多選題 CoT 作答的提示 [6]。以下是一個用于 MMLU 的范例提示，MMLU 是從單一 token 答案取樣過渡到長篇 CoT 搭配精確匹配答案检查的评估之一。

```
Answer the following multiple-choice question by giving the correct answer letter in
parentheses.
Provide CONCISE reasoning for the answer, and make sure to finish the response with
"Therefore, the answer is (ANSWER_LETTER)" where (ANSWER_LETTER) is one of (A), (B),
(C), (D), (E), etc.

Question: {question}
(A) {choice_A}
(B) {choice_B}
(C) ...

Answer the above question and REMEMBER to finish your response with the exact phrase
"Therefore, the answer is (ANSWER_LETTER)" where (ANSWER_LETTER) is one of (A), (B),
(C), (D), (E), etc.
```

*（范例說明：此提示要求模型以括號中的正確答案字母回答多選題，提供「簡潔的」推理，并務必以「Therefore, the answer is (答案字母)」这个精確片語結束回應，其中答案字母是 (A)、(B)、(C)、(D)、(E) 等其中之一。中间以模板變數 {question}、{choice_A}、{choice_B} 等代入題目与選項，結尾再次提醒模型記得以該精確片語作結。）*

这一點——尤其是當模型使用特殊格式将思考 token 与答案 token 分開時——促成了评估體制最近一次的重大更新。评估正朝向以下方向發展：以搭配思維鏈提示的生成式方式來测试模型的回應。

## 16.2 为何許多外部评估比較并不可靠（Why Many External Evaluation Comparisons Are Unreliable）

AI 公司模型發表公告中的语言模型评估，只能与其他新聞稿在很大的誤差範圍（error bars）下互相比較——也就是說，稍微好一點或差一點的模型應被視为相當——因为他們各自内部用于评估的流程，既未跨模型受控，也未被明確記錄。舉例來說，在 Olmo 3 專案中，作者發現在推理模型時代，大多數后训练评估在评估设置保持恆定的情況下，標準差介于 0.25 到 1.5 分之間 [18]——而使用不同的提示或取樣參數可能帶來更大的分數變化。各实验室在训练期間會對评估进行「爬山」（hillclimb），以使模型更有用，傳統上混合使用训练集、开发集（development set，又稱验证集 validation set）与保留评估集（held-out evaluation sets，又稱测试集 test set）。爬山（hillclimbing）是一個口語化的術語，用來描述讓模型在一組目標基準上逐步變好的实务。对于社群用來比較領先模型的公開评估而言，無從得知哪些被用于训练、哪些被保留用于测试。

隨着评估分數成为企業行銷方案的核心組成，它們在公司内部的实现方式已经漂移。有傳言指出主要 AI 实验室對 GSM8K 或 MATH 等重要评估使用「客製提示（custom prompts）」。这些做法演變得很快。

语言模型评估堆疊（evaluation stack）之所以被視为行銷，是因为这些评估没有堅實的真值來源（source of truth）。前沿实验室内部正在發生的事情是：评估套件被調校以符合他們的内部需求。當结果被分享出来時，我們得到的是实验室對其模型所得數字形式的輸出，而不是該函數的所有輸入。这些輸入是非常敏感的配置，而 OpenAI、Meta、Anthropic 与 Google 的配置全都不同。即使是完全開放的评估標準，也很難保證可重現性。将力氣集中在你自己的模型上，是接近可重複评估技術的唯一途徑。行銷的背後有着良善的意圖，起點正是各家的技術團隊。

比較多個实验室评估時的另一個混淆例子，是推断時扩展（inference-time scaling）被加入评估比較之中。推断時扩展显示，模型可以透過在推断時使用更多 token 來提升效能。因此，以推断所用的總 token 數來控制评估分數是重要的，但这尚未成为普遍的实务。

依據你在后训练中数据的格式化方式，模型在不同评估格式間會有顯着差異。舉例來說，兩個流行的開放數學数据集 NuminaMath [376] 与 MetaMath [377] 在训练中彼此衝突，原因是答案格式的細微差異——Numina 将答案放在 `\boxed{XYZ}` 中，而 MetaMath 将答案放在 `The answer is: XYZ` 之后——同时在兩者上训练，可能比只用其中一個的表現更差。強大的模型被训练成能夠應付多種格式，但它們通常仍有一個最強的格式。

最終，關于封閉模型评估的現狀，我們剩下幾個關鍵要點：

- 我們不知道、也不一定擁有各实验室正在爬山的關鍵测试集，因此某些评估只是代理指標（proxies）。
- 前沿模型的推断正因特殊系统提示、特殊 token 等而變得更加複雜，而我們不知道这如何影響评估；以及
- 我們不知道用于數值化回報封閉评估的所有格式与細節。

所有这些動態，加上过去幾年 AI 模型的極速進展，造就了類似圖 45 的着名圖表：每個時代的當紅基準都很快被解決。在單一基準層級描述这種動態的常用術語是飽和（saturation）。當每個基準接近 100% 時，模型的進展开始放緩，因为只剩下更難的（或者在許多情況下，標註錯誤的）数据點，这使得它作为训练進展（或兩個模型間比較）的衡量標準變得較不可靠。

## 16.3 实验室内部實際如何運用评估來改進模型（How Labs Actually Use Evaluations Internally to Improve Models）

如今，前沿语言模型的评估既是科學，也同樣是一門藝術；若要精確描述不同團隊如何運用评估來理解最先進的语言模型，那将足以寫成另一本教科書。

不同的團隊选择不同的评估來保持其獨立性——亦即使它們成为真正的测试集——但没有人揭露自己選了哪些。舉例來說，流行的推理评估 MATH 与 GSM8K 都有训练集，其提示可以輕易用來提升效能。使用來自同一分布的提示來提升效能，与透過在一般數學数据上训练而泛化到这些任務，是非常不同的兩件事。

事實上，这些*训练集*包含非常高品質的数据，因此模型在其上训练會有所受益。如果这些公司*并未*将對應的评估作为追蹤的核心指標，那麼在评估集上训练可能是務實的決定，因为高品質数据是模型开发的主要限制因素。

領先的 AI 实验室透過聚焦于少數關鍵评估來爬山，并在最后于核心公開集上回報分數。關鍵在于，他們用于追蹤進展的某些评估——例如 GPT-4 報告 [378] 中用于扩展律（scaling）交叉熵損失預測的数据集——往往并不公開。

后训练的评估与人工评估（human evaluation）高度相互依存。生成式语言模型的人工评估會产生 Elo 排名（在 Anthropic 早期的論文中很流行，例如 Constitutional AI），而對奖励模型（reward models）的人工评估則显示出一致性（agreement）。这些也可以透過 A/B 测试視窗向使用者提供兩個不同的模型來取得（如偏好数据一章所討論的）。

他們选择聚焦的那組有限的评估，在评估与训练之間形成了緊密的連結。曾有一段時間，關注焦點的评估是 MMLU。GPQA 在推理模型崛起期間極为流行，因为社群對科學能力的關注增加。实验室會修改评估，使其更符合自身需求，例如 OpenAI 發布 SWE-Bench-Verified [379]。每個前沿实验室還建置或购买了許多公眾無法取得的内部评估。

在内部改進评估對下游训练的關鍵作用是：**提升比較训练運行（training runs）時的統計檢定力（statistical power）**。透過更換评估，这些实验室降低了其優先訊號上的雜訊，以做出更明智的训练決策。

現代语言模型训练堆疊中后训练的複雜化，使这一點更加突出。如今评估语言模型涉及中等数量的 token 生成（而不只是查看答案的對數機率），因此也涉及运算開銷。前沿实验室在許多任務上使用小技巧來提升表現，是被普遍接受的事實——最常見的解釋是針對特定评估使用一次性的提示（one-off prompts）。

## 16.4 数据污染（Contamination）

當前语言模型实务（即不限于 RLHF 与后训练）的一個重大問題，是有意或無意地在训练中使用了评估数据集的数据。这被稱为数据集污染（dataset contamination）（是数据洩漏（data leakage）的一種形式），而相應地，避免它的实务稱为去污染（decontamination）。要對数据集去污染，需要在训练与测试数据集之間进行搜索，尋找詞或子詞 token 上的 n-gram 重疊匹配，或固定長度的字元子字串匹配（例如 50 個字元）[380]。数据可能被污染的途徑有很多，但最常見的是在多個階段從網路爬取训练数据。基準往往被列在會被爬取的公開網域上，或者使用者将問題輸入模型，而这些問題後來可能進入未來模型的候選训练数据。

舉例來說，在對 Tülu 3 的评估套件进行去污染時，作者發現流行的開放数据集受到 RLHF 流行评估的污染 [6]。这些重疊包括：UltraFeedback 受 TruthfulQA 污染、Evol-CodeAlpaca 受 HumanEval 污染、NuminaMath 受 MATH 污染，以及 WildChat 受安全性评估污染。这些是透過训练提示与评估集中精確提示之間的 8-gram 重疊找到的。

在其他情況下，模型被發現曾在与基準非常接近的数据上训练，例如保持數學問題的文字不變、只更換數字。这可能導致后训练體制中的異常行为，例如當模型以隨機奖励（random rewards）进行 RL 训练時基準分數竟然提升——这是一種人为设计的设置，唯有當模型存在某些類型的数据污染時，才应该會提升效能。这種基礎模型污染（base model contamination）——無法確切證明模型为何有特定行为——一直是許多建立在 Qwen 2.5 与 Qwen 3 基礎模型之上的早期 RLVR 研究的重大混淆變數（confounding variable）[186] [381]。

为了理解那些不揭露或不釋出训练数据的模型的污染狀況，人們建立了基準的新版本，其中包含從原版稍加擾動（perturbed）的問題（例如 MATH 的 [382]），以便觀察哪些模型被训练成匹配原始格式或問題。在这些擾動基準上的高变异數并不是污染的證實——污染很難證明。反而，它可能显示模型是以某種特定格式为前提训练的，而該格式可能無法轉化为真實世界的效能。

## 16.5 工具（Tooling）

有許多開源的评估工具可供人們选择。其中包括：

- 英國安全研究院（UK Safety Institute）的 Inspect AI [383]、
- HuggingFace 的 LightEval [384]，它驅動了 Open LLM Leaderboard [385]、
- EleutherAI 的评估框架（evaluation harness）[386]，建立在他們 GPT-Neo-X 模型的基礎設施之上（其中包含一套良好的 GPT-3 時代评估设置与配置）[387]、
- Ai2 基于 OLMES 的函数庫 [388]、
- 史丹佛基礎模型研究中心（Stanford's Center for Research on Foundation Models）的 HELM [389]、
- Mosaic（現为 Databricks）的 Eval Gauntlet [390]，等等。
