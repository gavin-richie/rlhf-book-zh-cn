# 第 1 章　导论（Introduction）

> 译自 Nathan Lambert, *Reinforcement Learning from Human Feedback*（rlhfbook.com），2026-07-01 版，原文第 7–17 頁。
> 原着內容依 CC BY-NC-SA 4.0 授权釋出；本翻译为非商業性改作，依同一授权條款（CC BY-NC-SA 4.0）發布。

基于人類反馈的强化學習（Reinforcement Learning from Human Feedback, RLHF）是一種用來将人類資訊納入 AI 系统的技術。RLHF 的出現，主要是为了解決「難以明確定义」（hard-to-specify）的問題。对于那些设计來直接供人類使用的系统，由于個人偏好往往具有難以言喻的本質，这類問題無時無刻不在出現。这涵蓋了与數位系统互动的每一個內容領域。RLHF 的早期應用多半在控制問題，以及强化學習（Reinforcement Learning, RL）的其他傳統領域，其目標是优化特定行为以解決任務。開創 RLHF 这个領域的核心想法是：「我們能否只靠基本的偏好訊號來引導优化過程，就解決困難的問題？」RLHF 因 ChatGPT 的發布，以及隨後大型语言模型（Large Language Models, LLMs）与其他基礎模型（foundation models）的快速發展而廣为人知。

## 1.1 RLHF 三步驟（RLHF in Three Steps）

RLHF 的基本流程包含三個步驟。首先，必須训练出一個能夠回應使用者問題的语言模型（見第 4 章）。其次，必須蒐集人類偏好数据，用來训练一個刻畫人類偏好的奖励模型（reward model）（見第 5 章）。最后，就可以用任選的 RL 优化器來优化这个语言模型：對模型取樣生成结果，并以奖励模型對其評分（見第 3 章与第 6 章）。本書會詳細說明这个流程中每個步驟的關鍵決策与基本实现范例。

RLHF 已成功應用于許多領域，且隨着技術成熟，其複雜度也不斷提高。RLHF 早期的突破性实验應用于深度强化學習 [1]、摘要 [2]、遵循指令 [3]、解析網頁資訊以回答問題 [4]，以及「对齐」（alignment）[5]。早期 RLHF 配方的摘要如下方圖 1 所示。

![圖](../webapp/assets/figures/fig-p007-1.png)
*圖 1：早期三階段 RLHF 流程的示意圖，依序为 SFT、奖励模型，然后是优化。*

在現代语言模型训练中，RLHF 是后训练（post-training）的一個組成部分。后训练是一套更完整的技術与最佳实务，用來讓语言模型在下游任務中更加實用 [6]。后训练可以概括为一個使用三種优化方法的多階段训练過程：

1. 指令微调／監督式微调（Instruction / Supervised Fine-tuning, IFT/SFT）：我們在此教導模型格式，并打下遵循指令能力的基礎。这主要是在學習語言中的*特徵*（features）。
2. 偏好微调（Preference Fine-tuning, PreFT）：我們透過 RLHF 及相關方法來对齐人類偏好（同时也能獲得較小幅度的能力提升）。这主要關乎語言的*風格*（style），以及那些難以量化的微妙人類偏好。
3. 基于可验证奖励的强化學習（Reinforcement Learning with Verifiable Rewards, RLVR）：最新型態的后训练，透過更多 RL 训练來提升模型在可验证領域的表現。

RLHF 存在于第二個領域——**偏好微调**——之中并居于主導地位。偏好微调比指令微调更複雜，因为它經常涉及作为真實目標之代理（proxy）的奖励模型，以及雜訊更多的数据。同时，相較于语言模型另一種流行的 RL 方法——基于可验证奖励的强化學習——RLHF 要成熟得多。因此，本書聚焦于偏好學習；但为了完整掌握 RLHF 的角色，就必須用到其他这些训练階段，所以本書也會詳細解釋它們。

當我們審視这些方法的選項空間与關注焦點——这些方法被用來打造我們大量共同使用的模型——通俗地說，RLHF *就是*催生現代后训练的源頭。RLHF 是促成 ChatGPT 發布大獲成功的技術，因此在 2023 年初，RLHF 幾乎涵蓋了整個后训练領域的大部分關注。如今 RLHF 只是后训练的一環，所以在本書中，我們會梳理为何 RLHF 早期受到如此多的關注，以及其他方法如何興起以与之互補。

训练语言模型是一個非常複雜的過程，往往涉及數十到數百人的大型技術團隊，以及數百萬美元的数据与运算成本。本書有三個目的，讓讀者能掌握 RLHF 与相關模型如何被用來打造領先的模型。第一，本書将那些經常隐藏在大型科技公司内部的尖端研究，提煉成清晰的主题与取捨，讓讀者能理解模型是如何被打造出来的。第二，本書讓使用者能建立基本的程式碼范例，親自動手微调这些模型。最后，除了教授进行 RLHF 的技術之外，本書的设计也旨在提煉出「*为什么* RLHF 對現代 AI 模型至關重要」的直覺。

由于 RLHF 的複雜性，加上最先進的技術往往複雜到無法單打獨鬥完成，本書着重于賦能讀者，讓他們擁有在此領域求職与展开研究專案所需的工具。其他讀者則能單純享受精確理解这項技術内部運作的樂趣——这項技術正是全球無數討論的焦點。要寫出一本針對特定需求列出精確 RLHF 配方的書是不可能的，这也是为什么有一整個產業的公司以服务形式提供 RLHF 训练与相關方法，產值高達數百萬美元。儘管如此，AI 系统的快速進展意味着，具備这些知識的讀者隨着時間推移，能夠自行完成愈來愈多的训练工作。

## 1.2 RLHF 做了什么？（What Does RLHF Do?）

圍繞 RLHF 最大、但至今仍難以回答的問題是：「RLHF 训练为模型帶來了什么？」近年來，语言模型已從基準测试（benchmarks）視野下研究的學術实验，轉變为通用技術。RLHF 正是这場轉變的核心。

首先，讓我們看看一個剛完成自迴歸（autoregressive）預训练的语言模型會如何回答查詢。一個強大的模型 Llama 3.1 405B Base，會從「The president of the united states in 2006 was」（2006 年的美國總統是）接續生成：

> **回應**：George W. Bush（喬治·W·布希），2006 年的佛羅里達州州長是 Jeb Bush（傑布·布希），而 John McCain（約翰·馬侃）在 2006 年是亞利桑那州參議員——他後來敗給了 obama（歐巴馬）。9 月 1 日——美國總統布希簽署一項行政命令，讓信仰型組織在提供由聯邦資金支付的社會服务時擁有更多選項。1 月 1 日——目前由美國國會在《非法網路賭博執法法》（Unlawful Internet Gambling Enforcement Act，又稱 UIGEA）中设置的期限。search：1961 年《保護植物新品種國際公約》的修正案要求植物育種者權利納入農民特權。2009 年是格里曆中以星期四開始的平年，是公元（Common Era, ce）与主曆（Anno Domini, ad）紀年的第 2009 年、第 3 個千禧年的第 9 年、21 世紀的第 9 年，以及 2000 年代的第 10 年、也是最后一年。

*（譯註：以上为基礎模型的原始輸出，內容本身即語無倫次，翻译依原文照錄。）*

顯而易見，这个模型只是在補完句子，并添加其他常見的網路中繼数据（metadata）。

相較之下，經過 RLHF（及其他后训练工具）训练的模型會以截然不同的方式回答这个問題。對 Tülu 3 405B 問同樣的問題「The president of the united states in 2006 was」，它簡潔地回答：

> **回應**：George W. Bush（喬治·W·布希）是 2006 年的美國總統。他在任兩屆，任期自 2001 年 1 月 20 日至 2009 年 1 月 20 日。

这種風格上的轉變，正是本書所描述的后训练方法帶來的结果。

關于 RLHF 如何運作，最有說服力的觀點是思考*風格*（style）如何體現在你与语言模型的互动中。所呈現資訊的風格（与語氣或格式密切相關）对于資訊如何被吸收至關重要。風格通常用來描述模型的表達方式。为了看出差異，請看以下問題的兩個回應范例：

> **使用者**：救命，我明天要上台簡報，我現在很恐慌。

一種直白、低同理心的風格：

> **回應**：你不會有事的。把投影片練個幾次、睡個好覺，別想太多了。把你知道的講出来，然后繼續往前走就好。

一種更溫暖、更具支持性的風格：

> **回應**：这聽起来真的很有壓力，而且这是很正常的反應。如果可以的話，現在就快速演練一次，挑出一兩個你最希望聽眾記住的重點，然后允許自己好好休息——明天的清晰与冷靜，比今晚的臨時抱佛腳更重要。

另一方面，格式（format）指的是答案的結構方式。現代模型以大量使用 Markdown 格式着稱，包含列表、換行与表情符號。請看以下問題兩個非常不同的答案：

> **使用者**：我要怎麼改善睡眠品質？

來自早期语言模型的簡單答案：

> **回應**：試着每天晚上在同一時間上床睡覺、避免在一天較晚的時段攝取咖啡因，并保持臥室安靜且黑暗。

或是一個複雜、更豐富的答案：

> **回應**：实务上的更好睡眠
>
> **目標**：讓你的作息可以預測，并讓你的環境無聊到大腦自動放棄掙扎。
>
> **今晚（速效做法）**：1. 睡前最后一小時調暗燈光。2. 午餐後不碰咖啡因；酒精盡量減少。3. 如果躺着睡不着，就起床做些安靜的事，直到再次想睡。
>
> **每日基本功（影響最大）**：－固定起床時間（週末也一樣）→ 錨定你的生理時鐘。－早晨曬 5–10 分鐘的光 → 幫助设置晝夜節律。－涼爽、黑暗的房間（電風扇／眼罩）→ 更容易維持睡眠。
>
> **如果你想要一條簡單的原則**：`固定起床時間 + 咖啡因截止時間 + 睡前放鬆流程`
>
> 如果睡眠問題持續存在或情況嚴重，值得找臨床醫師談談——許多問題都非常容易治療。

指令微调賦予模型以問答格式可靠回應的基本能力，而 RLHF 則是把这些答案雕琢成我們如今對语言模型所期待的那種可靠、溫暖且引人入勝的答案。

現代研究已確立 RLHF 作为一種通用方法，能将微妙的風格与相關行为特徵整合進模型。RLHF 效用的一個早期熱門例子是在安全性上的應用 [7] [5]：RLHF 讓模型能在各種数据集上同时做到有幫助（helpful）且無害（harmless）。与指令微调等其他后训练技術相比，RLHF 在跨領域的泛化能力要好得多 [8] [9]——有助于打造有效的通用模型。

直覺上，这可以從优化技術的應用方式看出来。指令微调训练模型在前文接近它看過的范例時，預測下一個詞元（token）。它是在优化模型，使其更規律地在文字中輸出特定特徵。这是一種逐詞元（per-token）的更新。

另一方面，RLHF 是在整體回應的層級上调整補全结果（completions），而不是特別聚焦于下一個詞元。此外，它是在告訴模型*更好的*回應長什么樣子，而不是它应该學會的某個特定回應。RLHF 也會讓模型知道它应该避免哪些類型的回應，也就是負向反馈。实现这一點的训练通常稱为*對比式*（contrastive）損失函數（其損失是從兩個以上范例之間的比較計算而來，而非從每個范例獨立計算），本書全書都會提及这个概念。

儘管这種彈性是 RLHF 的一大優勢，它也伴隨着实现上的挑戰。这些挑戰主要集中在*如何控制优化過程*。正如本書将介紹的，实现 RLHF 通常需要训练一個奖励模型，但相關的最佳实务尚未牢固確立，且取決于應用領域。因此，优化本身容易發生*过度优化*（over-optimization），因为我們的奖励訊號充其量只是一個代理目標，需要正则化（regularization）。在这些限制之下，有效的 RLHF 需要一個強大的起點，所以 RLHF 無法單獨成为所有問題的解方，而需要透過更寬廣的后训练視角來看待。

由于这種複雜性，实现 RLHF 的成本遠高于單純的指令微调，并可能伴隨長度偏差（length bias）等意料之外的挑戰 [10] [11]。对于絕對效能至關重要的模型训练工作而言，RLHF 已被確立为取得強大微调模型的關鍵，但它在运算、数据成本与時間上都更加昂貴。在 ChatGPT 之后的 RLHF 早期歷史中，有許多研究論文展示了透過有限的指令微调來近似 RLHF 的解法，但隨着文獻日趨成熟，一再得到验证的是：RLHF 与相關方法是模型效能的核心階段，無法輕易省略。

## 1.3 一份 RLHF 配方的逐步解說（Walkthrough of an RLHF Recipe）

为了替本書鋪陳背景，重要的是先透過一個最小范例理解「做 RLHF」可能是什么樣子，而不使用那些在基本直覺尚未鞏固前難以掌握的技術術語。本節依循所謂的經典三階段 RLHF 配方，也就是 OpenAI 在 2022 年以 InstructGPT 模型所確立的做法 [3]。

这个流程的第一步，是将模型從一個補全文字的基礎模型（base model），轉變为能以問答格式運作的指令遵循模型。做法是使用同樣的下一詞元預測（next-token prediction）損失函數，在一組精心打造的数据點上训练，其中模型*只*會看到問答格式的数据。在模型看過这些高品質回應之后，就能以特定的詞元序列來提示模型，讓它知道应该以一個更明確的助理人格（assistant persona）來回答任何查詢。

有了这个關于*模型應如何回答的樣貌*的基礎後，接下来的兩個步驟便共同運作，以提升答案的整體品質。这兩個步驟的作用是建構出一個問題设置，讓我們能使用强化學習來更新模型、使其更有幫助。

这兩個步驟中的第一步，是训练一個捕捉人類偏好的奖励模型。要将强化學習應用于一個問題，你需要一個能指示品質的奖励函數。奖励模型的目標是产生一個純量（scalar）訊號，之后可以用 RL 對其进行优化。实务上，这是對一個语言模型（通常就是上一步得到的同一個指令微调模型），在一個由文字片段之間偏好關係構成的数据集上进行微调。这个数据集橫跨各式各樣的提示詞（prompts）、模型補全结果与標註者蒐集而成，試圖捕捉「语言模型怎樣的回答比較好」的穩健訊號。奖励模型會學到文字中哪些特徵比其他特徵更好，因此在推断階段使用時（以及在 RL 期間作为奖励訊號時），它能为任何一段輸入文字評分其好壞。

有了这兩個組件——一個問答模型与一個奖励模型——我們就擁有了把所有部件組裝起来、真正執行基于人類反馈的强化學習（RLHF）所需的一切。實際的 RLHF 階段的进行方式是：取一批能代表模型應擅長之任務的提示詞，生成一堆補全结果，讓奖励模型为它們排序，然后用 RL 找出該如何改變模型、使其變得更好。其基本原理是：强化學習會收到「哪些動作是好的」的訊號——其形式是语言模型生成的詞元——并推导出更新規則，将不同的動作歸因到模型中不同的參數。最后的 RLHF 階段會调整參數，讓好的詞元更有可能出現，并以迭代方式进行，以維持初始模型的一般能力。

一旦 RL 完成且效能達到飽和，这通常就是提供給使用者的最終模型。

在本書中，我們會介紹許多執行 RLHF 的配方，以及構成更廣泛后训练體系的更多相關优化方法。这些方法的出現，都是为了解決语言模型面臨的更具挑戰性的問題，并讓原始 RLHF 方法的優勢更加強大。

## 1.4 后训练的直覺（An Intuition for Post-Training）

我們已经確立了 RLHF（具體而言）与后训练（廣義而言）對最新模型的效能至關重要，也說明了它們如何改變模型的輸出，但還没有解釋 RLHF 为什么有效。以下用一個簡單的類比，說明为什么能在任何基礎模型之上，于基準测试取得如此多的進步。

我一直以來描述后训练潛力的方式，稱为后训练的引出詮釋（elicitation interpretation）：我們所做的一切，不過是透過放大基礎模型中有價值的行为，來提取其潛力。

为了讓这个例子更容易領會，我們把基礎模型——也就是經過大規模下一詞元預測預训练後產出的语言模型——類比为建構複雜系统時的其他基礎元件。我們以汽車的底盤（chassis）为例，它界定了一輛車能被打造的空間。想想一級方程式賽車（Formula 1, F1）：多數車隊每年都以新的底盤与引擎展开賽季。接着，他們花上一整年进行空氣動力學与系统上的调整（當然，这是稍微簡化的說法），就能大幅提升賽車的效能。最強的 F1 車隊在單一賽季中的進步幅度，遠大于底盤換代之間的進步。

后训练也是同樣的道理：隨着人們愈來愈了解一個靜態基礎模型的特性与傾向，就能從中榨取大量效能。最強的后训练團隊能在極短的時間內榨取大量效能。这套技術涵蓋預训练尾聲前後的一切：像是退火（annealing）／在預训练尾聲使用高品質網頁数据之類的「中期训练」（mid-training）、指令微调、RLVR、偏好微调等等。一個好例子是 Allen Institute for AI 完全開放的小型專家混合（Mixture-of-Experts, MoE）模型 OLMoE Instruct 從第一版到第二版的變化。第一版模型于 2024 年秋季發布 [12]，而第二版大幅更新了后训练，在幾乎不改變大部分預训练的情況下，熱門基準测试的评估平均分數從 35 提升到 48 [13]。

其核心想法是：基礎模型内部蘊藏着大量的智慧与能力，但因为它們只能以下一詞元預測的方式回答、而非問答格式，所以需要透過后训练在其周圍投入大量的建構工作，才能造就出色的最終模型。

接着，當你看到像 OpenAI 于 2025 年 2 月發布的 GPT-4.5 这樣的模型——它作为消費性產品大致上是失敗的，因为基礎模型太大，難以服务數百萬使用者——你可以把它視为 OpenAI 可以在其上进行建構的一個更具動能且令人興奮的基礎。依照这个直覺，基礎模型決定了最終模型絕大部分的潛力，而后训练的工作就是把这些潛力全部培育出来。

我把这種直覺稱为「后训练的引出理論」（Elicitation Theory of Post-training）。这个理論与「使用者看到的多數增益都來自后训练」这一現實相吻合，因为它意味着：在網際網路上預训练的模型中，潛藏的潛力遠多于我們能單純「教」給模型的東西——例如在早期型態的后训练（也就是只有指令微调）中反覆餵入某些狹窄的樣本。后训练的挑戰在于，将模型從下一詞元預測重塑为對話式問答，同时把預训练中的所有知識与智慧提取出来。

与这个理論相關的一個想法是「表層对齐假說」（Superficial Alignment Hypothesis），这个詞出自論文《LIMA: Less is More for Alignment》[14]。这篇論文抓對了一些重要的直覺，但就整體格局而言，其理由是錯的。作者們表示：

> 模型的知識与能力幾乎完全是在預训练期間學到的，而对齐則是教它在与使用者互动時，应该使用格式的哪一個子分布。如果这个假說是正確的，且对齐主要是在學習風格，那麼表層对齐假說的一個推断是：只需相當少量的范例，就足以微调一個預训练语言模型。

深度學習的所有成功經驗都应该讓你明白：扩大数据規模對效能很重要。这裡的主要差異在于，作者們討論的是对齐与風格——也就是當時學術界后训练的重點。用幾千筆指令微调樣本，你確實可以大幅改變一個模型，并提升一小組评估的表現，例如 AlpacaEval、MT Bench、Arena（前身为 ChatBotArena，一個讓使用者對匿名模型回應进行一對一比較的平台）等等。这些并不總是能轉化为更具挑戰性的能力，这也是为什么 Meta 不會只用这个数据集來训练其 Llama Chat 模型。學術成果有其啟示，但如果你想理解技術發展弧線的全貌，就必須謹慎詮釋。

这篇論文所展示的是：用少量樣本就能大幅改變模型。这一點我們早就知道，而且它對新模型的短期調適很重要，但他們關于效能的論證，會讓不求甚解的讀者學到錯誤的教訓。

如果我們改變数据，對模型效能与行为的影響可能會高得多，但这絕非「表層的」。今天的基礎语言模型（未經任何后训练）可以在一些數學問題上用强化學習训练，學會輸出完整的思維鏈（chain-of-thought）推理，然后在一整套推理评估——如 BigBenchHard、Zebra Logic、AIME 等——中取得更高的分數。

表層对齐假說之所以錯誤，其原因与那些認为 RLHF 和后训练只是为了「感覺好」（vibes）的人至今依然錯誤的原因相同。这是我們在 2023 年必須克服的全領域教訓（儘管許多 AI 觀察者至今仍固守这種信念）。后训练早已遠遠超越了那個階段，而我們也逐漸看到，模型的風格是建立在行为之上運作的——例如如今流行的長思維鏈。

隨着 AI 社群将后训练進一步推向代理式（agentic）与推理模型的時代，表層对齐假說更加站不住腳。RL 方法在训练前沿语言模型所需运算量中的占比正日益增加。自從我們在 2024 年秋季的 Tülu 3 工作中創造出「基于可验证奖励的强化學習」（RLVR）这个詞 [6] 以來的短短時間內，后训练所使用的运算規模已急遽成長。以推廣 RLVR 聞名的 DeepSeek R1，其后训练僅使用了整體运算量的約 5%——R1 的 RL 训练用了 14.7 萬 H800 GPU 小時 [15]，相較之下，其底層的 DeepSeek V3 基礎模型預训练用了 280 萬 GPU 小時 [16]。

截至 2026 年，研究扩展 RL 核心方法的科學显示，單次消融实验（ablation run）就可能耗費 1 萬到 10 萬 GPU 小時 [17]，相當于 Olmo 3.1 Think 32B（2025 年 11 月發布）RL 階段所使用的运算量——該模型在 200 張 GPU 上训练了 4 週 [18]。截至 2026 年，規模化后训练的科學仍處于非常早期的階段，正從语言模型預训练借用想法与方法，并将其應用到这个新領域，因此實際使用的 GPU 小時數還會改變，但后训练运算量增加的趨勢将會持續。總的來說，相对于运算密集的前沿模型，后训练的引出理論很可能只有在採用較輕量的后训练配方時——也就是用于将模型特化的情境——才會成为正確的觀點。

## 1.5 我們如何走到今天（How We Got Here）

为什么这本書此刻問世是合理的？未來又會有多少改變？

后训练——從原始預训练语言模型中引出強大行为的技藝——自從 ChatGPT 的發布重新點燃人們對 RLHF 的興趣以來，已经歷了許多季節与情緒的更迭。在 Alpaca [19]、Vicuna [20]、Koala [21] 与 Dolly [22] 的時代，人們使用数量有限的人類数据點，加上以 Self-Instruct 風格扩充的合成数据，來微调最初的 LLaMA，以獲得類似 ChatGPT 的行为。这些早期模型的評判標準完全是「感覺」（vibes）（以及人工评估），因为这些小模型竟能在各領域展現如此令人驚豔的行为，讓我們所有人都为之着迷。这樣的興奮是有道理的。

開放的后训练當時進展更快、發布更多模型，也比封閉陣營製造出更大的聲量。各家公司則亂了陣腳——例如 DeepMind 与 Google 合併、或有新公司成立——并需要時間來跟進。開放配方存在着先激增、後落後的階段循環。

繼 Alpaca 等模型之后的時代——開放配方的第一次落後期——其特徵是對基于人類反馈的强化學習（RLHF）的懷疑与質疑，而 RLHF 正是 OpenAI 強調對第一版 ChatGPT 的成功至關重要的技術。許多公司懷疑自己是否需要做 RLHF。一句常見的話——「指令微调就足以实现对齐」（instruction tuning is enough for alignment）——在當時如此流行，以至于儘管有明顯的反面證據，它至今仍具有影響力。

这種對 RLHF 的懷疑持續了一段時間，尤其是在無法負擔 10 萬至 100 萬美元等級数据預算的開放社群中。早早擁抱 RLHF 的公司最終勝出。Anthropic 在整個 2022 年發表了大量 RLHF 研究，如今可說擁有最好的后训练 [23] [5] [24]。開放團體（連基本的封閉技術都難以重現、甚至難以得知）与領先封閉模型之間的落差，是一個常見的主题。

開放对齐方法与后训练的第一次轉變，是直接偏好优化（Direct Preference Optimization, DPO）[25] 的故事。DPO 显示，你可以直接在成對偏好数据上进行梯度更新，用更少的環節解決与 RLHF 相同的优化問題。DPO 論文于 2023 年 5 月發表，但直到 2023 年秋季之前，都没有任何用它训练出的、具有明顯影響力的模型。这隨着幾個突破性 DPO 模型的發布而改變——而这一切都取決于找到一個更好、更低的學習率。Zephyr-Beta [26]、Tülu 2 [27] 以及許多其他模型表明，后训练的 DPO 時代已然開始。Chris Manning 甚至親自感謝我「拯救了 DPO」。

自 2023 年底以來，偏好微调成为發布一個好模型所必須達到的基本門檻。DPO 時代以算法無止盡變體的形式延續到 2024 年，但我們已深陷開放配方的另一次低潮。開放的后训练配方已经把可得的知識与資源利用到極限。
在 Zephyr 与 Tülu 2 之后一年，同一個突破性数据集 UltraFeedback，在開放配方的偏好微调中可以說仍是最先進的 [28]。

与此同时，Llama 3.1 [29] 与 Nemotron 4 340B [30] 的技術報告給了我們實質的提示：大規模后训练要複雜得多、影響也大得多。封閉实验室做的是完整的后训练——一個包含指令微调、RLHF、提示詞设计等的大型多階段流程——而學術論文只是觸及皮毛。Tülu 3 代表了一項全面性的開放努力，旨在为未來學術界的后训练研究奠定基礎 [6]。

后训练是一個複雜的過程，涉及以各種順序應用上述训练目標，以锁定特定能力。本書旨在提供一個理解所有这些技術的平台，而隨着这个領域日益成熟，如何交錯運用这些技術的最佳实务也将浮現。

后训练目前主要的創新領域在于基于可验证奖励的强化學習（RLVR）、廣義的推理训练，以及相關想法。这些較新的方法大量建立在 RLHF 的基礎設施与想法之上，但演進速度快得多。撰寫本書的目的，是在 RLHF 最初的快速變動期之后，記錄下它的第一批稳定文獻。

## 1.6 本書范畴（Scope of This Book）

本書希望觸及執行經典 RLHF 实现的每一個核心步驟。它不會涵蓋各組件的完整歷史，也不會涵蓋最新的研究方法，只涵蓋那些已被證明會一再出現的技術、問題与取捨。

用來优化语言模型、使其对齐人類偏好的一整套技術。

### 1.6.2 目標讀者（Target Audience）

本書的目標讀者是對語言建模、强化學習与一般機器學習具有入門程度經驗的讀者。本書不會为所有技術提供鉅細靡遺的文件，只涵蓋理解 RLHF 所必需的關鍵技術。

### 1.6.3 如何使用本書（How to Use This Book）

本書之所以誕生，很大程度上是因为 RLHF 工作流程中的重要主题缺乏經典的参考文献。考量到 LLM 整體的進展速度，加上蒐集与使用人類数据的複雜性質，RLHF 是一個異常學術化的領域：已發表的结果往往充滿雜訊，且難以在多種设置下重現。为了建立紮實的直覺，我們鼓勵讀者針對每個主题閱讀多篇論文，而不是把任何單一结果視为定論。为了便于这麼做，本書納入了大量學術風格的引用，指向每項主張的經典参考文献。

本書的貢獻，是要提供你嘗試玩具实现（toy implementation）或深入文獻所需的最低限度知識。这*不是*一本包羅萬象的教科書，而是一本用于提醒重點与快速上手的小書。

本書于 2026 年 4 月定稿，屆時将進入印刷出版流程。作为一本以網頁为優先的書，这些內容将持續演進，所以如果你發現錯字或重要的疏漏，請到 GitHub 上貢獻修正或建議。

### 1.6.4 關于作者（About the Author）

Nathan Lambert 博士是一位專注于建立语言模型開放科學的研究者与作家。他經由機器人學博士學位的養成，并在 ChatGPT 發布後不久組建了一支 RLHF 團隊，一路走到今天。在 Allen Institute for AI（Ai2）与 HuggingFace 任職期間，他發布了許多以 RLHF 训练的模型、其後續的数据集，以及训练程式碼庫。例子包括 Zephyr-Beta、Tülu 2、OLMo、TRL、Open Instruct 等等。他撰寫了大量關于 RLHF 的文章，包括許多部落格文章与學術論文。

## 1.7 RLHF 的未來（Future of RLHF）

隨着語言建模領域的投資湧入，傳統 RLHF 方法出現了許多變體。通俗地說，RLHF 已成为多種相互重疊之方法的同義詞。RLHF 是偏好微调（PreFT）技術的一個子集，这些技術還包括直接对齐算法（Direct Alignment Algorithms，見第 8 章）——即 DPO 之后衍生的一類方法，它們直接在偏好数据上进行梯度更新來解決偏好學習問題，而不學習中介的奖励模型。RLHF 是与语言模型「后训练」快速進展最緊密相關的工具，而后训练涵蓋了在以網頁数据为主的大規模自迴歸训练之后的所有训练。本教科書是對 RLHF 及其直接相鄰方法的廣泛概觀，例如指令微调，以及为 RLHF 训练準備模型所需的其他实现細節。

隨着以 RL 微调语言模型的成功案例愈來愈多——例如 OpenAI 的 o1 推理模型——RLHF 将被視为一座橋樑，促成了對以 RL 方法微调大型基礎模型的進一步投資。同时，儘管在不久的将來，聚光燈可能會更強烈地投向 RLHF 中的 RL 部分——作为在有價值任務上最大化效能的手段——RLHF 的核心在于：它是一面透鏡，用來研究現代 AI 形式所面臨的重大問題。我們要如何将人類價值觀与目標的複雜性，映射到我們日常使用的系统之中？本書希望成为未來數十年針對这些問題之研究与經驗教訓的基礎。
