# 第 11 章　偏好资料（Preference Data）

> 译自 Nathan Lambert, *Reinforcement Learning from Human Feedback*（rlhfbook.com），2026-07-01 版，原文第 130–142 页。

偏好资料是偏好微调（preference fine-tuning）与人类回馈强化学习的引擎。我们试图用 RLHF 解决的核心问题，是我们无法精确地为 AI 模型的输出建立人类奖励与偏好的模型——也就是说，无法写出定义清楚、可供优化的损失函数——因此偏好资料就成了我们用来调校模型的代理讯号（proxy signal）。正是这些资料让我们得以贴合我们想要的行为，并避开某些我们厌恶的失效模式。这种资料是如此丰富的讯号来源，以至于很难完全取代这种优化风格。在偏好微调的范畴内，人们已提出许多搜集与运用这类资料的方法；而既然人类偏好无法被写成一个明确的奖励函数，未来还会出现更多方法，让「搜集带标注的偏好资料」这件事持续位居 RLHF 及相关技术的核心。时至今日，围绕偏好资料存在两大挑战，并贯穿本章：1）搜集作业的复杂度与成本；2）偏好资料必须从「正在被训练的模型」的生成结果上搜集（称为「on-policy」）。

在本章中，我们将详述资料格式化方式的技术决策，以及搜集这些资料的组织实务。

## 11.1 为什么我们需要偏好资料（Why We Need Preference Data）

RLHF 之所以需要偏好资料，是因为想在单一奖励函数中直接捕捉复杂的人类价值，实际上是不可能的——如前一章第 10 章所讨论的，心理学、经济学与哲学领域的大量脉络都显示，要精确地为人类偏好建模，是一个永远无法彻底解决的问题。搜集这类资料来训练奖励模型，是 RLHF 背后最初的构想之一 [38]，并在现代语言模型崛起的整个过程中持续被广泛使用。关于*这类资料为何如此有效*，其中一个核心直觉是：无论对人类还是对监督资料搜集的 AI 模型而言，针对一个提示词去分辨答案的好坏，都远比自己生成一个好答案容易得多。本章聚焦于取得偏好资料的*操作机制（mechanics）*，而最佳实务则取决于所要解决的具体问题。

## 11.2 搜集偏好资料（Collecting Preference Data）

要充分发挥人类资料的价值，需要对模型进行迭代训练、花费数十万（甚至数百万）美元、撰写极为详尽的资料标注指引、透过居中仲介搜集工作的资料代工企业（data foundry）来落实想法（或是自行聘用足够数量的标注者（annotator）），还有其他种种不断叠加的挑战。这不是一个可以轻率看待的流程。在所有关于 RLHF 的公开知识中，如何把这类资料搜集好，也是整个流程中最不透明的环节之一。截至 2026 年，还没有任何开放模型完整公开其人类偏好资料以及搜集这些资料所用的方法（近年为模型释出的最大规模人类偏好资料集，是 NVIDIA Nemotron 团队的 HelpSteer 系列工作，包括 HelpSteer2-Preference 与 HelpSteer3-Preference [109], [257]）。基于这些原因，许多新团队或新专案在着手 RLHF 时会略过人类资料，改用 AI 回馈资料、现成的奖励模型，或其他方法来绕过从零开始搜集资料的需求。

偏好资料搜集流程中一个重要的假设是：对你的训练流程而言，最好的资料是相对于训练流程中前一个（或多个）检查点（checkpoint）「同策略（on-policy）」的资料。回想一下，在后训练（post-training）中，我们从一个基础模型出发，接着执行一组训练*阶段（stages）*，产生一系列*检查点*。在这种情况下，偏好资料可以在一个已经历监督式微调的检查点上搜集，而这些偏好资料将用于 RLHF 训练的下一个阶段。

这里的 on-policy 一词借自强化学习文献；在强化学习中，on-policy 是一个技术术语，指某次梯度更新所用的资料来自最新版本的策略。在偏好资料中，on-policy 的用法稍微宽松一些，指资料搜集自当前的模型家族。不同模型的生成结果各有不同的模式，这使得来自关系密切模型的偏好资料，在优化的关键区域中更为稳健。研究显示，使用这种 on-policy 资料，而非其他从 HuggingFace 等平台上汇集众多热门模型补全结果的常见资料集，对于有效的 RLHF 训练格外重要 [89]。

on-policy 资料的必要性并没有完善的文献记载，但许多知名的技术报告——例如早期版本的 Claude 或 Llama 2——都展示了以 RLHF 贯穿多个训练阶段对最终性能的助益，这正好与此相呼应。同样的不确定性也适用于热门的 AI 回馈资料领域——最新的 AI 模型所使用的人类与 AI 偏好资料的确切配比并不为外界所知。已知这些资料来源是提升性能的宝贵途径，但需要对流程进行细致的调校，才能从资料管线中萃取出这种潜在性能。

一个细微但重要的观点是：偏好资料中被*选中（chosen）*的答案，往往不是一个放诸四海皆*正确*的答案。它只是相对于同时呈现的其他选项而言更好的答案（例如更清楚、更安全、更有帮助，或错误较少）。可能出现这样的情况：针对某个提示词所比较的每一个补全结果全都正确、或全都错误，而模型仍然可以从标注良好的资料中学习。

### 11.2.1 标注介面（Interfaces）

搜集偏好资料的关键之一，是人与模型互动所使用的介面；但这与其说是科学，不如说是一门艺术，因为介面的细微变化如何影响用户与模型的互动，至今仍缺乏充分研究。一个关于用户体验如何改变模型「气质印象（vibe）」的例子是*速度*：随着推理模型（reasoning models）的兴起，如果模型回复得太快，用户反而可能认为它比较不聪明（尽管用户整体上显然希望更快得到答案）。

这第一个范例是*纯训练资料（training-data only）*介面，其目标是在搜集对话的同时取得丰富的中继资料。如今这些模型已广为流行，各种应用程式会在日常使用过程中直接向用户开放搜集偏好的介面，就像其他科技产品会在一小部分正式流量中对新功能进行 A/B 测试一样。至于这些偏好资料是被直接用于训练未来的模型，还是仅仅用来评估各模型之间的相对表现，则因应用而异。这种形式的互动范例如下方图 31 所示，来自较早期版本的 ChatGPT。

### 11.2.2 排序 vs. 评分（Rankings vs. Ratings）

关于如何搜集偏好资料，最重大的决策是：资料应该采用排序（rankings）——即模型补全结果之间的相对顺序——还是评分（ratings）——即对每段文本各自给出的分数。常见做法是用排序来训练，但评分也经常作为中继资料使用，且／或在相关文献中已有探讨。

搜集评分的一种简单方式，是以 1 到 5 分为*单一*补全结果打分数：

- **5** —— 优异：正确、清楚，且格外有帮助
- **4** —— 良好：正确、清楚且有用
- **3** —— 尚可：可以接受，但没有特别之处
- **2** —— 不佳：部分正确，但令人困惑或不完整
- **1** —— 非常差：错误或毫无帮助

当同一个提示词有多个补全结果时，一种制作偏好资料的简单方法是选出评分最高的补全，再随机搭配一个分数较低的补全（UltraFeedback 及其衍生工作即采用此法 [28]）。

然而，搜集偏好最常见的技巧，是使用 Likert 量表（Likert scale）进行相对排序 [259]，也就是请用户在一组补全结果中选出他们偏好的回复。举例来说，一个 5 点 Likert 量表如下所示（请注意：没错，Likert 量表和评分一样，是用单一整数来记录排序结果，因此两种偏好资料搜集方式的核心差异，在于资料的结构方式）：

**表 5：两个回复 A 与 B 之间的 5 点 Likert 量表范例。**

| A≫B | A>B | 平手 | B>A | B≫A |
|:---:|:---:|:---:|:---:|:---:|
| 1 | 2 | 3 | 4 | 5 |

某些早期针对语言模型的 RLHF 工作使用 8 点 Likert 量表，以刻划两个回复之间的偏好程度 [5]。偶数点数的量表排除了平手的可能性：

**表 6：两个回复 A 与 B 之间的 8 点 Likert 量表范例。**

| A≫≫B | | | A>B | B>A | | | B≫≫A |
|:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|
| 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |

在这个案例 [5] 中，如同其他工作一样，这些资讯最终仍被化约为二元讯号，用于奖励模型的训练。

### 11.2.3 多轮资料（Multiturn Data）

在实务上，关于如何解析与搜集多轮（multi-turn）资料——也就是包含多个相关提示词的对话——经常引发核心问题。在真实世界的互动中，一笔偏好资料通常只针对「最后一个」提示词搜集，但也有一些情境会对每一个回复都给出偏好。当每个回复都被给予偏好时，对话传统上会沿着「被选中」的答案继续进行。在训练时，常见做法是把对话中每一轮的训练资料都当成一个「单一提示词」纳入，让模型从补全该提示词中学习。这可以有效地把较长的对话展开成许多训练提示词，但必须谨慎处理，以免使训练资料产生偏差。目前仍有许多研究问题不断浮现，围绕着资料搜集中难以控制的变因——其中包括一个受 John Schulman 启发的问题：为生成结果标注偏好的人，是否应该就是撰写该提示词的人（以避免谄媚（sycophancy））。如果提示词的撰写者无法标注偏好资料，多轮搜集实际上就不太可行，因为对话需要即时延续——有时对偏好资料而言，提示词的策划（curation）与回复的比较是两个不同的问题（也因为维护模型即时端点需要额外工作）。在训练时，对话中所有先前的轮次都会被遮蔽、不计入损失，如指令微调一章所讨论的。

### 11.2.4 结构化偏好资料（Structured Preference Data）

在 RLHF 与后训练的许多应用中，偏好资料可以凭借资料本身固有的结构*自动*产生——也就是说，这些领域使得正确性或偏好的自动检查成为可能。举例来说，在数学推理领域，被选中的回复可以是正确答案，被拒绝的回复可以是错误答案。另一个例子是精确指令遵循（precise instruction following），例如评测基准 IFEval [260]，其提示词形如：

> **提示词**：帮我写一首关于金鱼的短诗。**每个句子都要以字母 g 开头。**

这段查询的第二部分称为约束条件（constraint），而偏好资料可以这样建构：在「被选中」栏位放入一个遵循该约束的范例。建构这种偏好资料——它会被归类为*合成（synthetic）*偏好资料——的做法是对同一个模型（或多个模型）提示两次：一次包含约束条件，一次不含。

例如，带着约束条件对 GPT-4.5-Preview 提问，会得到以下结果。

> **提示词**：Write me a short poem about a goldfish. Start each sentence with the letter g.（帮我写一首关于金鱼的短诗。每个句子都要以字母 g 开头。）
>
> **回复**：Golden swimmer, circling slow, Gleaming scales in water's glow. Gentle fins dance softly by, Gazing out with quiet eye. Glass-bound world, a simple sphere, Gliding calmly, free of fear. Graceful turns in endless roam, Goldfish finds a crystal home.
>
> *（中译：金色的泳者缓缓绕行，晶亮的鳞片在水光中闪烁。柔软的鱼鳍轻轻舞动，静静的眼眸向外凝望。玻璃围成的世界，一个简单的球体，牠从容滑行，无所畏惧。优雅地回旋、无尽地遨游，金鱼寻得一座水晶之家。）*

而不含约束条件时（结果显示，这也是品质较低的输出）：

> **提示词**：Write me a short poem about a goldfish.（帮我写一首关于金鱼的短诗。）
>
> **回复**：In circles bright, the goldfish glides, A spark of sun that gently rides Through waters clear, in endless spins— A golden whisper, scales like fins.
>
> Its world confined, yet vast within, Each bubble breathed, a tale begins. In silent waves, content to roam, The goldfish dreams its bowl as home.
>
> *（中译：金鱼在明亮的圆圈中滑行，宛如一缕阳光的火花，轻轻乘行于清澈的水中，无尽地旋转——一声金色的呢喃，鳞片如鳍。牠的世界虽受局限，内里却辽阔无垠，每一颗吐出的气泡，都是一个故事的开端。在寂静的水波中安然遨游，金鱼把鱼缸梦想成家。）*

关键在于，偏好资料所用的提示词必须包含该约束条件。在学术研究之外的领域，基于上述这类归纳偏差（inductive bias）的偏好资料应用远多得多（相对于本章主要聚焦、以品质为基础的偏好而言）。这类资料已被证明能让偏好微调在相关评测上带来实质的性能提升，例如指令遵循、数学等 [6]。

#### 11.2.4.1 替代方案（Alternatives）

还有多种其他搜集有用 RLHF 回馈资料的方式，只是尚未被同等深入地探索。例子包括使用带有方向性标签的单笔资料点（例如上方图 33 所示的 Ai2 playground），直接搭配为单向讯号设计的演算法，如 Kahneman-Tversky 优化（Kahneman-Tversky Optimization, KTO）[261]。也有人针对不同类型的回馈讯号提出其他演算法，例如细粒度回馈（fine-grained feedback，如词元层级的回馈）[262]，或自然语言回馈（natural language feedback，例如由标注者亲自撰写回复）[263]，以更复杂的资料搜集设定为代价，换取更丰富的学习讯号。

### 11.2.5 资料来源与合约（Sourcing and Contracts）

取得人类偏好资料是一个繁复且昂贵的过程。以下描述的是在这个领域快速演进之际取得偏好资料的实际经验。随着时间推移，这些流程将变得远为自动化且更有效率（尤其是 AI 回馈在流程中占比日益提高之后）。

第一步是寻找提供资料的供应商（或使用自己的标注者）。就像在 AI 热潮的高峰期取得尖端 Nvidia GPU 一样，取得资料供应商的管道同样是一场「看你认识谁」的游戏——因为有能力供应资料的业者是供给有限的。如果你在 AI 生态系中具有声望，最好的资料公司会希望把你纳入客户名单，以提升公众形象并着眼于长期成长机会。前几批资料也经常提供折扣，好让训练团队「上钩」。

如果你是这个领域的新进者，你可能很难迅速取得所需的资料。众所周知，资料供应商会优先服务预算庞大的订单，以及拥有影响力品牌或未来营收潜力可观的新客户。从商业角度来看，这在许多方面是很自然的，因为资料代工公司在组织人力进行有效资料标注方面，本身就供给有限。

一个反复出现的不幸模式是：若客户不以违约为由威胁采取法律或财务行动，资料公司往往无法按合约交付资料。还有一些公司为了公关宣传，把从未合作过的公司列为客户，被踢爆时则声称「不知道怎么会这样」。整个过程中存在着大量潜在的官僚或行政障碍。举例来说，合约中的预设条款往往在细则（fine print）中禁止将取得后的产出物开源。

合约敲定之后，资料买方与资料供应商会就所购任务的标注指引达成共识。这些是内容繁复的文件，包含大量细节、边角案例（corner cases）与资料的优先顺序。一个广为人知的资料标注指引范例，是 OpenAI 为 InstructGPT 释出的那份 [3]。

视所需资料的领域而定，资料可供标注或策划的时程各不相同。数学推理或程式撰写等高需求领域，必须提前数周敲定排程。当你正在为下一个模型搜集资料集，却发现晚一点搜集可能更理想时，单纯延后资料搜集并不总是行得通——Scale AI 等公司管理其人力的方式，就像 AI 研究实验室管理丛集上运算密集的工作一样（提前数周或数月规划各项资源将分配到何处）。

一切谈妥之后，实际的搜集过程对后训练团队而言是高风险、高压力的时刻。所有的训练基础设施、评估工具，以及如何运用资料并做出后续决策的计划，都必须事先到位。如果资料无法轻易嵌入现有的 RLHF 资料管线，就得花很长时间才能取得资料伙伴所需的资讯，以便在过程*进行中*尝试改进搜集方式。搜集无法无缝整合进训练管线的资料，往往会过时、沦为资源的浪费。

资料以每周分批的方式交付，且愈到合约后期交付量愈大。举例来说，一份典型的偏好资料合约可能横跨 6 周的交付期。前几周用于进一步校准，而后几周才是团队最指望能改进模型的时候。

*图 35：向供应商取得人类偏好资料的多批次周期概览。爬坡期（ramp up period）让目标与方法得以逐步收敛，以产出尽可能好的资料。预期较早批次的资料中，会有较大比例因品质问题而必须舍弃。这只是一份较小型资料合约（约 50 万美元）的时程范例，规模大得多的资料合约可能差异甚钜。*

目标是在第 4 或第 5 周时，资料已能明显改进模型。一些前沿模型曾提及这一点，例如 Llama 2 资料搜集中的 14 个阶段 [49]，但事情并不总是一帆风顺。举例来说，一个首次尝试使用人类偏好资料的团队，可能还不具备足以在评测上取得实质提升的 RLHF 准备度（RLHF preparedness）。等到最后几周来临，他们被迫继续搜集由自己都没有信心的模型端点所生成的偏好资料。

当资料全数到位后，仍有充裕的时间可以学习并改进模型。透过这些供应商取得资料，最好被视为一个朝着既定目标迈进的持续过程。它需要迭代式的实验、大量的投入与专注。花在这些资料集上的数百万美元，很可能有相当部分被「浪费」掉、未被用于最终模型，但那只是做这门生意的必要成本。并没有多少组织具备充分运用这类人类资料所需的余裕与专业。

请注意，本节所述*并不*等同于购买人类撰写指令资料的经验；后者的流程时间压力较小。早期的后训练流程是围绕着这样的设计建立的：训练的第一阶段高度仰赖针对一组提示词、由人类精心撰写的答案。这一阶段的资料不受 on-policy 限制的约束，原因有多重：指令资料是直接用在基础模型之上，因此 on-policy 概念并不真正适用；指令微调的损失函数也不需要偏好微调那种对比式资料。今日，人类资料的另一个主要焦点在于为后训练生成提示词——这些提示词决定了模型训练主题的分布——或是针对模型性能前沿的高难度任务。这些资料的权衡取舍，将在第 12 章「合成资料」中进一步讨论。

## 11.3 偏误：资料搜集中需要留意的事（Bias: Things to Watch Out For in Data Collection）

偏好资料固然不可或缺，但众所周知，它也容易受到许多细微偏误（bias）的影响，使其搜集过程易于出错。这些偏误极为常见——例如前缀偏误（prefix bias，即补全结果的开头不成比例地主导了偏好判断）[264]——以至于它们很容易被传递到最终模型 [265]（尤其我们深知模型的好坏取决于其资料）。这些问题往往相当隐微，而各种干预手段的成效差异极大。其中许多偏误，例如谄媚（sycophancy，即过度附和用户宣称的信念或奉承用户，即使这会降低真实性）[266]，反映的是人类自身的问题，而这些问题通常落在人们想得到、会提供给标注合作伙伴或标注员的标注准则之外。其他偏误，例如冗长偏误（verbosity）[10] [267] 或格式化习惯 [268]，出于类似的原因而产生，但在训练中较容易侦测与缓解。能否缓解资料中这些细微的偏误，正是「好的」与「卓越的」偏好资料之间的分野，也因此是「好的」与「卓越的」RLHF 训练之间的分野。

## 11.4 RLHF 偏好资料的开放问题（Open Questions in RLHF Preference Data）

驱动 RLHF 的资料，往往是由多方利害关系人共同策划的，混合了有偿聘雇与消费者使用两种来源。这些资料——代表着在单一实例中对两段文本的偏好——是透过极其有限的互动，去捕捉一个广泛而多样的函数。鉴于资料的数量相对于它开始要表征的复杂度而言极为稀疏，关于其策划过程与影响，应该有更多问题被公开分享与讨论。

目前，最热门的大型语言模型所用的资料集，正由专业的标注工作团队产生。这引出了许多问题：是谁在创造这些资料？他们的职场脉络又如何形塑这些资料？

尽管 RLHF 作为核心方法在整个领域已臻成熟，关于如何让其实务与其初衷保持一致，仍存在许多核心的开放问题。以下列举数项：

- **资料搜集情境（Data collection contexts）**：在专业工作环境中搜集的偏好资料，能否如实反映设计实验的研究者的意图，或适切地迁移到下游用户身上？这与志愿工作者相比如何？情境如何形塑偏好？这些资料如何影响下游模型？用户介面的影响如何在资料中被量测？反复标注偏好资料会如何改变一个人自身的偏好？被指示遵循一套既定偏好的专业群众工作者（crowd-workers），究竟是遵循指示，还是遵循他们与生俱来的价值观？
- **回馈的类型（Type of feedback）**：RLHF 预设的运作方式——成对偏好（pairwise preferences）——是否以其预期的形式捕捉了偏好？在同样的资料上，RLHF 中的比较能否用预设的比较方式与进阶的多轴回馈机制 [262] 分别进行？哪些类型的比较才能反映人类在文本中传达偏好的方式？
- **母体人口特征（Population demographics）**：是谁在完成这些资料？是否维持了多元的母体组成？多样性的缺乏会如何以可量测的方式影响模型？要适切代表一个特定母体，最少需要多少人？偏好标注者之间意见不一致的案例该如何处理——视为杂讯来源，还是视为讯号？
- **偏好真的体现在模型中了吗？（Are the Preferences Expressed in the Models?）**：随着 RLHF 及相关方法日趋成熟，其动机——让模型对齐抽象的人类偏好概念——已逐渐偏离其实际用途——让模型对用户更有效用。由于产业界 RLHF 工作的封闭性质，有一个无法量测的回馈回路：检验模型的行为是否符合资料搜集过程中提供给标注者的规格说明。我们可用来稽核这件事的工具十分有限，例如 OpenAI 的模型规范（Model Spec）[269] 详述了*他们希望自家模型做什么*，但我们并不确切知道这如何转化为实际的资料搜集。
