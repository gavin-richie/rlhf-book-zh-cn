# 第 11 章　偏好数据（Preference Data）

> 译自 Nathan Lambert, *Reinforcement Learning from Human Feedback*（rlhfbook.com），2026-07-01 版，原文第 130–142 頁。

偏好数据是偏好微调（preference fine-tuning）与人類反馈强化學習的引擎。我們試圖用 RLHF 解決的核心問題，是我們無法精確地为 AI 模型的輸出建立人類奖励与偏好的模型——也就是說，無法寫出定义清楚、可供优化的損失函數——因此偏好数据就成了我們用來調校模型的代理訊號（proxy signal）。正是这些数据讓我們得以貼合我們想要的行为，并避開某些我們厭惡的失效模式。这種数据是如此豐富的訊號來源，以至于很難完全取代这種优化風格。在偏好微调的范畴內，人們已提出許多蒐集与運用这類数据的方法；而既然人類偏好無法被寫成一個明確的奖励函數，未來還會出現更多方法，讓「蒐集帶標註的偏好数据」这件事持續位居 RLHF 及相關技術的核心。時至今日，圍繞偏好数据存在兩大挑戰，并貫穿本章：1）蒐集作業的複雜度与成本；2）偏好数据必須從「正在被训练的模型」的生成结果上蒐集（稱为「on-policy」）。

在本章中，我們将詳述数据格式化方式的技術決策，以及蒐集这些数据的組織实务。

## 11.1 为什么我們需要偏好数据（Why We Need Preference Data）

RLHF 之所以需要偏好数据，是因为想在單一奖励函數中直接捕捉複雜的人類價值，實際上是不可能的——如前一章第 10 章所討論的，心理學、經濟學与哲學領域的大量脈絡都显示，要精確地为人類偏好建模，是一個永遠無法徹底解決的問題。蒐集这類数据來训练奖励模型，是 RLHF 背後最初的構想之一 [38]，并在現代语言模型崛起的整個過程中持續被廣泛使用。關于*这類数据为何如此有效*，其中一個核心直覺是：無論對人類还是對監督数据蒐集的 AI 模型而言，針對一個提示詞去分辨答案的好壞，都遠比自己生成一個好答案容易得多。本章聚焦于取得偏好数据的*操作機制（mechanics）*，而最佳实务則取決于所要解決的具體問題。

## 11.2 蒐集偏好数据（Collecting Preference Data）

要充分發揮人類数据的價值，需要對模型进行迭代训练、花費數十萬（甚至數百萬）美元、撰寫極为詳盡的数据標註指引、透過居中仲介蒐集工作的数据代工企業（data foundry）來落實想法（或是自行聘用足夠数量的標註者（annotator）），還有其他種種不斷疊加的挑戰。这不是一個可以輕率看待的流程。在所有關于 RLHF 的公開知識中，如何把这類数据蒐集好，也是整個流程中最不透明的環節之一。截至 2026 年，還没有任何開放模型完整公開其人類偏好数据以及蒐集这些数据所用的方法（近年为模型釋出的最大規模人類偏好数据集，是 NVIDIA Nemotron 團隊的 HelpSteer 系列工作，包括 HelpSteer2-Preference 与 HelpSteer3-Preference [109], [257]）。基于这些原因，許多新團隊或新專案在着手 RLHF 時會略過人類数据，改用 AI 反馈数据、現成的奖励模型，或其他方法來繞過從零開始蒐集数据的需求。

偏好数据蒐集流程中一個重要的假設是：對你的训练流程而言，最好的数据是相对于训练流程中前一個（或多個）检查點（checkpoint）「同策略（on-policy）」的数据。回想一下，在后训练（post-training）中，我們從一個基礎模型出發，接着執行一組训练*階段（stages）*，产生一系列*检查點*。在这種情況下，偏好数据可以在一個已经歷監督式微调的检查點上蒐集，而这些偏好数据将用于 RLHF 训练的下一個階段。

这裡的 on-policy 一詞借自强化學習文獻；在强化學習中，on-policy 是一個技術術語，指某次梯度更新所用的数据來自最新版本的策略。在偏好数据中，on-policy 的用法稍微寬鬆一些，指数据蒐集自當前的模型家族。不同模型的生成结果各有不同的模式，这使得來自關係密切模型的偏好数据，在优化的關鍵區域中更为穩健。研究显示，使用这種 on-policy 数据，而非其他從 HuggingFace 等平台上匯集眾多熱門模型補全结果的常見数据集，对于有效的 RLHF 训练格外重要 [89]。

on-policy 数据的必要性并没有完善的文獻記載，但許多知名的技術報告——例如早期版本的 Claude 或 Llama 2——都展示了以 RLHF 貫穿多個训练階段對最終效能的助益，这正好与此相呼應。同樣的不確定性也適用于熱門的 AI 反馈数据領域——最新的 AI 模型所使用的人類与 AI 偏好数据的確切配比并不为外界所知。已知这些数据來源是提升效能的寶貴途徑，但需要對流程进行細緻的調校，才能從数据管線中萃取出这種潛在效能。

一個細微但重要的觀點是：偏好数据中被*選中（chosen）*的答案，往往不是一個放諸四海皆*正確*的答案。它只是相对于同时呈現的其他選項而言更好的答案（例如更清楚、更安全、更有幫助，或錯誤較少）。可能出現这樣的情況：針對某個提示詞所比較的每一個補全结果全都正確、或全都錯誤，而模型仍然可以從標註良好的数据中學習。

### 11.2.1 標註介面（Interfaces）

蒐集偏好数据的關鍵之一，是人与模型互动所使用的介面；但这与其說是科學，不如說是一門藝術，因为介面的細微變化如何影響使用者与模型的互动，至今仍缺乏充分研究。一個關于使用者体验如何改變模型「氣質印象（vibe）」的例子是*速度*：隨着推理模型（reasoning models）的興起，如果模型回覆得太快，使用者反而可能認为它比較不聰明（儘管使用者整體上顯然希望更快得到答案）。

这第一個范例是*純训练数据（training-data only）*介面，其目標是在蒐集對話的同时取得豐富的中繼数据。如今这些模型已廣为流行，各種應用程式會在日常使用過程中直接向使用者開放蒐集偏好的介面，就像其他科技產品會在一小部分正式流量中對新功能进行 A/B 测试一樣。至于这些偏好数据是被直接用于训练未來的模型，还是僅僅用來评估各模型之間的相對表現，則因應用而異。这種形式的互动范例如下方圖 31 所示，來自較早期版本的 ChatGPT。

### 11.2.2 排序 vs. 評分（Rankings vs. Ratings）

關于如何蒐集偏好数据，最重大的決策是：数据应该採用排序（rankings）——即模型補全结果之間的相對順序——还是評分（ratings）——即對每段文字各自給出的分數。常見做法是用排序來训练，但評分也經常作为中繼数据使用，且／或在相關文獻中已有探討。

蒐集評分的一種簡單方式，是以 1 到 5 分为*單一*補全结果打分數：

- **5** —— 優異：正確、清楚，且格外有幫助
- **4** —— 良好：正確、清楚且有用
- **3** —— 尚可：可以接受，但没有特別之處
- **2** —— 不佳：部分正確，但令人困惑或不完整
- **1** —— 非常差：錯誤或毫無幫助

當同一個提示詞有多個補全结果時，一種製作偏好数据的簡單方法是選出評分最高的補全，再隨機搭配一個分數較低的補全（UltraFeedback 及其衍生工作即採用此法 [28]）。

然而，蒐集偏好最常見的技巧，是使用 Likert 量表（Likert scale）进行相對排序 [259]，也就是請使用者在一組補全结果中選出他們偏好的回覆。舉例來說，一個 5 點 Likert 量表如下所示（請注意：沒錯，Likert 量表和評分一樣，是用單一整數來記錄排序结果，因此兩種偏好数据蒐集方式的核心差異，在于数据的結構方式）：

**表 5：兩個回覆 A 与 B 之間的 5 點 Likert 量表范例。**

| A≫B | A>B | 平手 | B>A | B≫A |
|:---:|:---:|:---:|:---:|:---:|
| 1 | 2 | 3 | 4 | 5 |

某些早期針對语言模型的 RLHF 工作使用 8 點 Likert 量表，以刻劃兩個回覆之間的偏好程度 [5]。偶數點數的量表排除了平手的可能性：

**表 6：兩個回覆 A 与 B 之間的 8 點 Likert 量表范例。**

| A≫≫B | | | A>B | B>A | | | B≫≫A |
|:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|
| 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |

在这个案例 [5] 中，如同其他工作一樣，这些資訊最終仍被化約为二元訊號，用于奖励模型的训练。

### 11.2.3 多輪数据（Multiturn Data）

在实务上，關于如何解析与蒐集多輪（multi-turn）数据——也就是包含多個相關提示詞的對話——經常引發核心問題。在真實世界的互动中，一筆偏好数据通常只針對「最后一個」提示詞蒐集，但也有一些情境會對每一個回覆都給出偏好。當每個回覆都被給予偏好時，對話傳統上會沿着「被選中」的答案繼續进行。在训练時，常見做法是把對話中每一輪的训练数据都當成一個「單一提示詞」納入，讓模型從補全該提示詞中學習。这可以有效地把較長的對話展开成許多训练提示詞，但必須謹慎处理，以免使训练数据产生偏差。目前仍有許多研究問題不斷浮現，圍繞着数据蒐集中難以控制的變因——其中包括一個受 John Schulman 啟發的問題：为生成结果標註偏好的人，是否应该就是撰寫該提示詞的人（以避免諂媚（sycophancy））。如果提示詞的撰寫者無法標註偏好数据，多輪蒐集實際上就不太可行，因为對話需要即時延續——有時對偏好数据而言，提示詞的策劃（curation）与回覆的比較是兩個不同的問題（也因为維護模型即時端點需要額外工作）。在训练時，對話中所有先前的輪次都會被遮蔽、不計入損失，如指令微调一章所討論的。

### 11.2.4 結構化偏好数据（Structured Preference Data）

在 RLHF 与后训练的許多應用中，偏好数据可以憑藉数据本身固有的結構*自動*产生——也就是說，这些領域使得正確性或偏好的自動检查成为可能。舉例來說，在數學推理領域，被選中的回覆可以是正確答案，被拒絕的回覆可以是錯誤答案。另一個例子是精確指令遵循（precise instruction following），例如評測基準 IFEval [260]，其提示詞形如：

> **提示詞**：幫我寫一首關于金魚的短詩。**每個句子都要以字母 g 開頭。**

这段查詢的第二部分稱为約束條件（constraint），而偏好数据可以这樣建構：在「被選中」欄位放入一個遵循該約束的范例。建構这種偏好数据——它會被歸類为*合成（synthetic）*偏好数据——的做法是對同一個模型（或多個模型）提示兩次：一次包含約束條件，一次不含。

例如，帶着約束條件對 GPT-4.5-Preview 提問，會得到以下结果。

> **提示詞**：Write me a short poem about a goldfish. Start each sentence with the letter g.（幫我寫一首關于金魚的短詩。每個句子都要以字母 g 開頭。）
>
> **回覆**：Golden swimmer, circling slow, Gleaming scales in water's glow. Gentle fins dance softly by, Gazing out with quiet eye. Glass-bound world, a simple sphere, Gliding calmly, free of fear. Graceful turns in endless roam, Goldfish finds a crystal home.
>
> *（中譯：金色的泳者緩緩繞行，晶亮的鱗片在水光中閃爍。柔軟的魚鰭輕輕舞動，靜靜的眼眸向外凝望。玻璃圍成的世界，一個簡單的球體，牠從容滑行，無所畏懼。優雅地迴旋、無盡地遨遊，金魚尋得一座水晶之家。）*

而不含約束條件時（结果显示，这也是品質較低的輸出）：

> **提示詞**：Write me a short poem about a goldfish.（幫我寫一首關于金魚的短詩。）
>
> **回覆**：In circles bright, the goldfish glides, A spark of sun that gently rides Through waters clear, in endless spins— A golden whisper, scales like fins.
>
> Its world confined, yet vast within, Each bubble breathed, a tale begins. In silent waves, content to roam, The goldfish dreams its bowl as home.
>
> *（中譯：金魚在明亮的圓圈中滑行，宛如一縷陽光的火花，輕輕乘行于清澈的水中，無盡地旋转——一聲金色的呢喃，鱗片如鰭。牠的世界雖受侷限，內裡卻遼闊無垠，每一顆吐出的氣泡，都是一個故事的開端。在寂靜的水波中安然遨遊，金魚把魚缸夢想成家。）*

關鍵在于，偏好数据所用的提示詞必須包含該約束條件。在學術研究之外的領域，基于上述这類歸納偏差（inductive bias）的偏好数据應用遠多得多（相对于本章主要聚焦、以品質为基礎的偏好而言）。这類数据已被證明能讓偏好微调在相關評測上帶來實質的效能提升，例如指令遵循、數學等 [6]。

#### 11.2.4.1 替代方案（Alternatives）

還有多種其他蒐集有用 RLHF 反馈数据的方式，只是尚未被同等深入地探索。例子包括使用帶有方向性標籤的單筆数据點（例如上方圖 33 所示的 Ai2 playground），直接搭配为單向訊號设计的算法，如 Kahneman-Tversky 优化（Kahneman-Tversky Optimization, KTO）[261]。也有人針對不同類型的反馈訊號提出其他算法，例如細粒度反馈（fine-grained feedback，如詞元層級的反馈）[262]，或自然語言反馈（natural language feedback，例如由標註者親自撰寫回覆）[263]，以更複雜的数据蒐集设置为代價，換取更豐富的學習訊號。

### 11.2.5 数据來源与合約（Sourcing and Contracts）

取得人類偏好数据是一個繁複且昂貴的過程。以下描述的是在这个領域快速演進之際取得偏好数据的實際經驗。隨着時間推移，这些流程将變得遠为自動化且更有效率（尤其是 AI 反馈在流程中占比日益提高之后）。

第一步是尋找提供数据的供應商（或使用自己的標註者）。就像在 AI 熱潮的高峰期取得尖端 Nvidia GPU 一樣，取得数据供應商的管道同樣是一場「看你認識誰」的遊戲——因为有能力供應数据的業者是供給有限的。如果你在 AI 生態系中具有聲望，最好的数据公司會希望把你納入客戶名單，以提升公眾形象并着眼于長期成長機會。前幾批数据也經常提供折扣，好讓训练團隊「上鉤」。

如果你是这个領域的新進者，你可能很難迅速取得所需的数据。眾所周知，数据供應商會優先服务預算龐大的訂單，以及擁有影響力品牌或未來營收潛力可觀的新客戶。從商業角度來看，这在許多方面是很自然的，因为数据代工公司在組織人力进行有效数据標註方面，本身就供給有限。

一個反覆出現的不幸模式是：若客戶不以違約为由威脅採取法律或財務行動，数据公司往往無法按合約交付数据。還有一些公司为了公關宣傳，把從未合作過的公司列为客戶，被踢爆時則聲稱「不知道怎麼會这樣」。整個過程中存在着大量潛在的官僚或行政障礙。舉例來說，合約中的預設條款往往在細則（fine print）中禁止将取得後的產出物開源。

合約敲定之后，数据買方与数据供應商會就所購任務的標註指引達成共識。这些是內容繁複的文件，包含大量細節、邊角案例（corner cases）与数据的優先順序。一個廣为人知的数据標註指引范例，是 OpenAI 为 InstructGPT 釋出的那份 [3]。

視所需数据的領域而定，数据可供標註或策劃的時程各不相同。數學推理或程式撰寫等高需求領域，必須提前數週敲定排程。當你正在为下一個模型蒐集数据集，卻發現晚一點蒐集可能更理想時，單純延後数据蒐集并不總是行得通——Scale AI 等公司管理其人力的方式，就像 AI 研究实验室管理叢集上运算密集的工作一樣（提前數週或數月規劃各項資源将分配到何處）。

一切談妥之后，實際的蒐集過程對后训练團隊而言是高風險、高壓力的時刻。所有的训练基礎設施、评估工具，以及如何運用数据并做出後續決策的計畫，都必須事先到位。如果数据無法輕易嵌入現有的 RLHF 数据管線，就得花很長時間才能取得数据夥伴所需的資訊，以便在過程*进行中*嘗試改進蒐集方式。蒐集無法無縫整合進训练管線的数据，往往會過時、淪为資源的浪費。

数据以每週分批的方式交付，且愈到合約後期交付量愈大。舉例來說，一份典型的偏好数据合約可能橫跨 6 週的交付期。前幾週用于進一步校準，而後幾週才是團隊最指望能改進模型的時候。

![圖](../webapp/assets/figures/fig-p140-1.png)
*圖 35：向供應商取得人類偏好数据的多批次週期概覽。爬坡期（ramp up period）讓目標与方法得以逐步收斂，以產出盡可能好的数据。預期較早批次的数据中，會有較大比例因品質問題而必須捨棄。这只是一份較小型数据合約（約 50 萬美元）的時程范例，規模大得多的数据合約可能差異甚鉅。*

目標是在第 4 或第 5 週時，数据已能明顯改進模型。一些前沿模型曾提及这一點，例如 Llama 2 数据蒐集中的 14 個階段 [49]，但事情并不總是一帆風順。舉例來說，一個首次嘗試使用人類偏好数据的團隊，可能還不具備足以在評測上取得實質提升的 RLHF 準備度（RLHF preparedness）。等到最后幾週來臨，他們被迫繼續蒐集由自己都没有信心的模型端點所生成的偏好数据。

當数据全數到位後，仍有充裕的時間可以學習并改進模型。透過这些供應商取得数据，最好被視为一個朝着既定目標邁進的持續過程。它需要迭代式的实验、大量的投入与專注。花在这些数据集上的數百萬美元，很可能有相當部分被「浪費」掉、未被用于最終模型，但那只是做这門生意的必要成本。并没有多少組織具備充分運用这類人類数据所需的餘裕与專業。

請注意，本節所述*并不*等同于购买人類撰寫指令数据的經驗；後者的流程時間壓力較小。早期的后训练流程是圍繞着这樣的设计建立的：训练的第一階段高度仰賴針對一組提示詞、由人類精心撰寫的答案。这一階段的数据不受 on-policy 限制的約束，原因有多重：指令数据是直接用在基礎模型之上，因此 on-policy 概念并不真正適用；指令微调的損失函數也不需要偏好微调那種對比式数据。今日，人類数据的另一個主要焦點在于为后训练生成提示詞——这些提示詞決定了模型训练主题的分布——或是針對模型效能前沿的高難度任務。这些数据的權衡取捨，将在第 12 章「合成数据」中進一步討論。

## 11.3 偏誤：数据蒐集中需要留意的事（Bias: Things to Watch Out For in Data Collection）

偏好数据固然不可或缺，但眾所周知，它也容易受到許多細微偏誤（bias）的影響，使其蒐集過程易于出錯。这些偏誤極为常見——例如前綴偏誤（prefix bias，即補全结果的開頭不成比例地主導了偏好判斷）[264]——以至于它們很容易被傳遞到最終模型 [265]（尤其我們深知模型的好壞取決于其数据）。这些問題往往相當隱微，而各種干預手段的成效差異極大。其中許多偏誤，例如諂媚（sycophancy，即过度附和使用者宣稱的信念或奉承使用者，即使这會降低真實性）[266]，反映的是人類自身的問題，而这些問題通常落在人們想得到、會提供給標註合作夥伴或標註員的標註準則之外。其他偏誤，例如冗長偏誤（verbosity）[10] [267] 或格式化習慣 [268]，出于類似的原因而产生，但在训练中較容易偵測与緩解。能否緩解数据中这些細微的偏誤，正是「好的」与「卓越的」偏好数据之間的分野，也因此是「好的」与「卓越的」RLHF 训练之間的分野。

## 11.4 RLHF 偏好数据的開放問題（Open Questions in RLHF Preference Data）

驅動 RLHF 的数据，往往是由多方利害關係人共同策劃的，混合了有償聘僱与消費者使用兩種來源。这些数据——代表着在單一實例中對兩段文字的偏好——是透過極其有限的互动，去捕捉一個廣泛而多樣的函數。鑑于数据的数量相对于它開始要表徵的複雜度而言極为稀疏，關于其策劃過程与影響，应该有更多問題被公開分享与討論。

目前，最熱門的大型语言模型所用的数据集，正由專業的標註工作團隊产生。这引出了許多問題：是誰在創造这些数据？他們的職場脈絡又如何形塑这些数据？

儘管 RLHF 作为核心方法在整個領域已臻成熟，關于如何讓其实务与其初衷保持一致，仍存在許多核心的開放問題。以下列舉數項：

- **数据蒐集情境（Data collection contexts）**：在專業工作環境中蒐集的偏好数据，能否如實反映设计实验的研究者的意圖，或適切地遷移到下游使用者身上？这与志願工作者相比如何？情境如何形塑偏好？这些数据如何影響下游模型？使用者介面的影響如何在数据中被量測？反覆標註偏好数据會如何改變一個人自身的偏好？被指示遵循一套既定偏好的專業群眾工作者（crowd-workers），究竟是遵循指示，还是遵循他們与生俱來的價值觀？
- **反馈的類型（Type of feedback）**：RLHF 預設的運作方式——成對偏好（pairwise preferences）——是否以其預期的形式捕捉了偏好？在同樣的数据上，RLHF 中的比較能否用預設的比較方式与進階的多軸反馈機制 [262] 分別进行？哪些類型的比較才能反映人類在文字中傳達偏好的方式？
- **母體人口特徵（Population demographics）**：是誰在完成这些数据？是否維持了多元的母體組成？多樣性的缺乏會如何以可量測的方式影響模型？要適切代表一個特定母體，最少需要多少人？偏好標註者之間意見不一致的案例該如何处理——視为雜訊來源，还是視为訊號？
- **偏好真的體現在模型中了吗？（Are the Preferences Expressed in the Models?）**：隨着 RLHF 及相關方法日趨成熟，其動機——讓模型对齐抽象的人類偏好概念——已逐漸偏離其實際用途——讓模型對使用者更有效用。由于產業界 RLHF 工作的封閉性質，有一個無法量測的反馈迴路：檢驗模型的行为是否符合数据蒐集過程中提供給標註者的規格說明。我們可用來稽核这件事的工具十分有限，例如 OpenAI 的模型規範（Model Spec）[269] 詳述了*他們希望自家模型做什么*，但我們并不確切知道这如何轉化为實際的数据蒐集。
