# 第 7 章　推理与推理时扩展（Reasoning and Inference-Time Scaling）

> 译自 Nathan Lambert, *Reinforcement Learning from Human Feedback*（rlhfbook.com），2026-07-01 版，原文第 94–104 頁。

推理模型（reasoning models）与推断時扩展（inference-time scaling）讓语言模型的效能在 2024 年底、貫穿 2025 年、乃至未來，都实现了巨大的躍進。推断時扩展指的是在生成過程中使用更多运算來提升模型效能的能力，例如产生更長的推理鏈（reasoning chains）或取樣多個回應。被训练成在回答前进行大量思考的语言模型，能極为出色地利用这項特性。这些模型以大量的可验证奖励强化學習（Reinforcement Learning with Verifiable Rewards, RLVR）[6] 训练而成，但仍然使用大量的 RLHF。在本章中，我們回顧引領 AI 社群徹底改觀、重新認識 RL 在语言模型中潛力的歷程，回顧 RLVR 的基本原理，重點介紹關鍵研究，并指出将在未來幾年定义这个領域的爭論。

## 7.1 RLVR 的角色（The Role of RLVR）

首先，在 2016 年的神經資訊处理系统（Neural Information Processing Systems, NeurIPS）會議上，Yann LeCun 首次提出他如今廣为人知的蛋糕比喻，用來說明現代機器學習系统中學習發生的位置：

> 如果智慧是一塊蛋糕，蛋糕的主體是非監督式學習（unsupervised learning），蛋糕上的糖霜是監督式學習（supervised learning），而蛋糕上的櫻桃則是强化學習（RL）。

隨着現代语言模型与后训练（post-training）技術堆疊近期的變化，这个類比如今大致上已然成真。RLHF 是它的前奏，而主要應用于數學、程式碼与科學主题的推理模型 RL，則是它的印證。在这个類比中：

- 在海量網際網路数据上进行的自監督式學習（self-supervised learning）構成了蛋糕的絕大部分（尤其是以 FLOPs 計算的运算量來看）；
- 后训练的開端——針對指令的監督式微调（supervised fine-tuning, SFT）——将模型調校到一個較窄的分布；以及
- 最后，「純粹的」强化學習（RL）是頂端的那顆櫻桃。用來打造新一代「推理（reasoning）」或「思考（thinking）」模型的大規模强化學習，就是这塊收尾的拼圖（同时也借助了 RLHF 的幫助——RLHF 并不被視为古典 RL，我們稍後會說明）。

这一小部分的推理训练隨着**思考模型（thinking models）**的出現而興起。这類模型結合了本書所討論的各種后训练技術來对齐偏好，并在可验证領域（verifiable domains）上进行 RL 训练，從而大幅提升推理、程式撰寫与數學解題等能力。

这些模型的训练方法——可验证奖励强化學習（Reinforcement Learning with Verifiable Rewards, RLVR）[6]——的流程与 RLHF 非常相似，但它讓奖励模型（reward model）變成可選項，改用一個評分函數：答案正確時回傳正值奖励，否则回傳 0。

舉例來說，想想为 RLHF 与 RLVR 評分回應有多麼不同。在 RLHF 中，奖励模型必須评估主觀的品質：

> **提示（Prompt）**：請解釋經濟學中機會成本（opportunity cost）的概念。
>
> **回應（Response）**：機會成本是你在做決策時所放棄的次佳選項的價值。例如，如果你花一小時讀書而不是去工作，機會成本就是你原本可以賺到的工資……

为这个回應評分，需要判斷清晰度、準確性、完整性与有用性——这些品質全都需要習得的偏好，而且不存在一個明確的正確答案。

相較之下，RLVR 使用會回傳明確分數的验证函數（verification functions）。以數學为例：

> **提示（Prompt）**：所有小于 20 的質數之和是多少？
>
> **回應（Response）**：小于 20 的質數为 2、3、5、7、11、13、17 与 19。将它們相加：$2 + 3 = 5$，接着 $5 + 5 = 10$，接着 $10 + 7 = 17$，接着 $17 + 11 = 28$，接着 $28 + 13 = 41$，接着 $41 + 17 = 58$，最后 $58 + 19 = 77$。答案是 $\boxed{77}$。
>
> **验证（Verification）**：`extracted_answer == 77` $\rightarrow$ 奖励 = 1

`\boxed{}` 標記是從數學排版慣例中借來的做法，它讓答案抽取變得非常直接——用一個簡單的正規表示式（regular expression）就能從回應中抽出最終答案，無論模型是如何得出这个答案的。請注意，也存在其他答案抽取方法，例如僅使用「答案是：」（"The answer is:"）这樣的片語（如上例所示）、`<answer>` 之類的特殊 token，或 `####` 之類的分隔符號。

对于程式碼生成，验证通常採取單元测试（unit tests）的形式：

> **提示（Prompt）**：請寫一個 Python 函數 `fib(n)`，回傳第 n 個費波那契數（Fibonacci number），其中 fib(0) = 0 且 fib(1) = 1。
>
> **回應（Response）**：
>
> ```python
> def fib(n):
>     if n < 2:
>         return n
>     return fib(n - 1) + fib(n - 2)
> ```
>
> **验证（單元测试）（Verification (unit tests)）**：
>
> ```python
> assert fib(0) == 0    # 基本情況（base case）
> assert fib(1) == 1    # 基本情況（base case）
> assert fib(10) == 55  # 較大的值（larger value）
> ```
>
> （所有测试通过 $\rightarrow$ 奖励 = 1）

單元测试是程式碼天然的验证函數：它們以已知的輸入—輸出配對來執行模型的解答。一種常見的評分方式是进行簡單的閘控（gating）：若所有斷言（assertions）都通过，奖励为 1；只要有任何一個失敗，奖励为 0。其他设置則採用与通过测试數成正比的部分給分。对于这兩個例子而言，都不需要習得的奖励模型，而且大多數设置也確實不使用（因为模型在这些領域對过度优化 over-optimization 具有穩健性），不過也可以透過奖励的線性組合來納入一個奖励模型。

RLVR 背後的想法在 RL 文獻中并不新穎——根據答案是否正確來进行梯度更新，这个核心概念幾乎就是强化學習的教科書定义。将其應用于语言模型時的創新之處，主要在于如何在維持被微调模型強大且通用的能力的同时进行應用。在此之中，語言建模文獻裡也有許多相關的想法，讓模型從關于答案正確性的反馈中學習。

最初，在我參与、創造出「可验证奖励 RL（RLVR）」一詞的那項工作中 [6]，这个方法原本要被命名为「標準答案奖励 RL」（RL with Ground Truth rewards, RLGT）。然而 RLVR 与單純從標準答案（ground truth）學習有着微妙的差異。在數學等領域中，存在單一的標準答案可用來验证解答，如同前面所見。在其他領域，例如程式碼生成或精確的指令遵循（instruction following），答案可以透過检查函數（例如單元测试）來验证——即使存在多個正確解答，而非只有單一的標準答案。RLVR 進展的核心，在于擁有種類多樣且有深度的可验证問題，即便確切的解答無法事先得知。

![圖](../webapp/assets/figures/fig-p096-1.png)
*圖 25：以 RL 反馈迴圈形式呈現的 RLVR。这裡以验证函數取代了奖励模型。*

最早成功部署这類训练的模型是 OpenAI 的 o1 [53] 与開放權重（open-weight）模型 DeepSeek R1 [15]。此後不久，整個 AI 產業都将这種训练流程与模型風格列为優先事項。这裡的核心變化，与其說是这種 RL 设置本身是全新的，不如說是训练階段的重新配置与不同行为優先順序的调整。推理模型帶來了一個「扩展 RL 训练成为理所當然」的時代。

至于这些模型展現出何種行为，請看以下例子：比較 DeepSeek V3 0325 与他們的推理模型 DeepSeek R1，對查詢 `Write me a short poem about a goldfish`（幫我寫一首關于金魚的短詩）的回應。DeepSeek V3 非常直截了當：

> **回應（Response）**：金魚之夢（Goldfish Dreams）
>
> 在清澈渾圓的玻璃缸裡，
> 一尾小金魚無聲地游弋。
> 鱗片閃耀如陽光的親吻，
> 牠悠然漂蕩在水中的幸福裡。
>
> 魚鰭一撥，光影一閃，
> 在光線中追逐着泡泡。
> 牠是否夢想着遼闊的海洋？
> 还是小小世界已然足夠——那是牠的驕傲？

而 DeepSeek R1 的体验則不同。它會先生成大量的思考 token 來構思回應，然后才回覆使用者。答案呈現如下：

> **回應（Response）**：`<thinking>` 好的，使用者想要一首關于金魚的短詩。先來腦力激盪一些与金魚相關的意象。金魚通常養在魚缸裡，對吧？所以也許可以從場景開始。「鎏金之缸（gilded bowl）」或「水晶球（crystal globe）」这類詞应该可行。
>
> 接着，想想金魚的動作。牠們游得很流暢，所以會想到「疾游（dart）」、「滑行（glide）」或「迴旋（swirl）」这類詞。也許可以把牠們的魚鰭形容成「絲綢般的（silken）」，以強調纖細感。
>
> 然后，考慮金魚周遭的環境。陽光穿過水面會产生粼粼波光。「陽光起舞（sunbeams dance）」或「漣漪迴旋（ripples spin）」这類詞或許能捕捉那種感覺。加入城堡或鵝卵石之類的元素會增添俏皮感。
>
> 主题呢？也許是金魚的小小世界与牠對自由的感知之間的對比。魚缸如同一個宇宙，微小卻完整。以一種神祕感或靜默的凝視作結，可以增加深度。需要保持簡潔，也許四段、帶押韻。讓我检查一下節奏与流暢度。避免陳腔濫調，但要平易近人。好，來把它組合起来。`</thinking>`
>
> 液態玻璃中的鎏金之夢（Gilded Dreams in Liquid Glass）
>
> 鎏金之缸，水晶之球，
> 微小的潮汐在寂靜中流淌——
> 一抹橙色的閃光，一襲輕聲的羅衣，
> 你疾游過陽光照亮的靛藍。
>
> 你的世界很小，卻也無邊無際——
> 每顆鵝卵石、每座城堡、每株舒展的水草。
> 水面将天空折成蔚藍，
> 漣漪旋转着你的液態世界。
>
> 你滑行過我們永遠無從知曉的神話，
> 一位靜默的君王，隱身于薄霧。
> 夢，是否隨泡泡漂向遠方？
> 还是化作紫水晶中的記憶？
>
> 我們看着你描摹你無盡的圓——
> 一滴淚中的宇宙。

`<thinking>` 標籤中的 token 就是模型的推理。对于更複雜的問題，推理階段可能需要數千個 token 才會產出答案。因此，長上下文（long-context）语言模型是進階推理行为的先決條件，但那不是本章的焦點。

關于*这種训练如何運作*的核心直覺是：对于一個給定的模型，我們重複以下循環：

1. 對多個問題取樣多個答案，
2. 朝着正確的答案进行梯度更新，然后
3. 重複这个過程，反覆使用同樣的数据。

值得注意的是，这个極其簡單的方法（在数据分布經過細心设计、训练基礎設施稳定的前提下）能讓模型透過一遍又一遍地重訪相同的問題來學習。更了不起的是，模型在这些训练問題上的進步，能夠泛化到它從未見過的問題与（部分）領域！

这个簡單的方法讓模型得以在行为空間（behavior space）中进行輕量的搜索，而 RL 算法則提高那些与正確答案相關的行为出現的可能性。

## 7.2 新推理模型的起源（The Origins of New Reasoning Models）

在此我們詳述導致 2025 年推理模型爆發的高層次趨勢。

### 7.2.1 为什么 RL 現在行得通了？（Why Does RL Work Now?）

儘管有許許多多「RL 還行不通」的評論 [148]，以及詳述 RL 深層可重現性問題的論文 [149]，这个領域仍然克服了这些障礙，找到了高影響力的應用。其中一些已在本書中介紹，例如 ChatGPT 的 RLHF 与 DeepSeek R1 的 RLVR，但還有許多其他應用，包括改善晶片设计 [150]、精通電玩遊戲 [151]、自動駕駛 [152] 等等。以 RL 为核心的语言模型训练起飛，显示这个研究領域在許多根本問題上取得了進展，包括：

- **RL 的稳定性是可以解決的**：自 RL 誕生以來，限制其普及的因素一直是稳定性。这體現在兩個方面。首先，學習本身可能反覆無常、不總是有效。其次，眾所皆知，这種训练比標準语言模型训练更脆弱，更容易出現損失尖峰（loss spikes）、崩潰等問題。如今無數新模型的發布都在預训练基礎模型之上使用这種帶有可验证奖励的 RL 训练風格，學術界也已大量採納。RL 的技術進入門檻正處于歷史最低點。
- **開源版本早已「存在」**：許多用于以 RLVR 及相關技術训练语言模型的工具早已存在。例子包括 TRL [47]、Open Instruct [6]、veRL [153] 与 OpenRLHF [154]，其中許多都建立在 RLHF 与后训练發展歷程中較早期的优化成果之上。工具的可及性正在催生規模龐大且不斷加速的研究。

多方数据显示，用于推理的 RL 训练大約要到 2024 年之后推出的領先模型上才變得可行，这表示模型必須先具備一定水準的底層能力，推理训练才有可能成功。

### 7.2.2 RL 训练与推断時扩展（RL Training vs. Inference-Time Scaling）

以强化學習训练來引出推理行为及可验证領域上的效能，与推断時扩展的概念密切相關。推断時扩展，又稱测试時扩展（test-time scaling），是指在推断階段使用更多运算能力，以便在下游任務上表現更好的一大類方法。在 DeepSeek R1 与 OpenAI o1 發布之前，推断時扩展的方法就已被研究——而这兩者的發布大幅推升了各界對 RL 训练的投資熱潮。例子包括價值引導取樣（value-guided sampling）[155]，或搭配答案抽取的重複隨機取樣 [156]。除此之外，推断時扩展還可以用來改進思維鏈（chain-of-thought）推理解題以外的更多 AI 训练方法，例如讓奖励模型深入考量各個選項 [84] [157]。

RL 训练是通往「推断時扩展定律（inference-time scaling laws）被實際運用」的一條捷徑，但長期而言，我們将擁有更多方法來引出我們所需的推断時權衡，以達到最佳效能。以 RL 大量训练模型，通常能讓模型在每個回應中生成更多 token，且这種增加与下游效能的提升高度相關（虽然序列長度增加是預設的行为，但也有研究明確探討*不*依賴这種推断時扩展來提升效能）。这与早期 RLHF 系统中所見的長度偏差（length-bias）[10] 有着本質上的不同——在那些系统中，人類偏好训练的副作用是拉長回應的平均長度，以換取偏好排名上的微幅提升。

除了核心的 RL 训练模型之外，還有許多方法正被探索，以持續推進推理与推断時运算的極限。由于这些方法演進迅速，大多超出本書的範圍，但它們包括：透過指令微调将較大 RL 训练模型的推理行为蒸馏（distill）到較小模型 [158]、組合更多推断呼叫 [159] 等等。这裡的重點在于下游效能与生成 token 数量增加之間的相關性——否则那只是浪費能源。

### 7.2.3 RLVR 的未來（超越推理）（The Future (Beyond Reasoning) of RLVR）

在許多領域中，这些新形態的 RLVR 因为聚焦于效能而非行为，而与开发者的目標更加一致。標準的微调 API 通常使用參數高效微调方法，例如 LoRA（Low-Rank Adaptation，一種只训练少量附加矩陣而非全部模型權重的參數高效方法，也稱为參數高效微调 parameter-efficient fine-tuning, PEFT），搭配針對指令的監督式微调。开发者傳入提示（prompts）与完成文本（completions），模型透過更新參數去匹配这些完成文本，從而提高你的数据中的特徵在模型生成內容中出現的頻率。

RLVR 則聚焦于匹配答案。給定查詢与正確答案，RLVR 幫助模型學會產出正確答案。標準指令微调通常只對数据进行 1 到 2 個 epoch 的損失更新，而 RLVR 之所以獨樹一格，正是因为它會在同樣少量的数据點上进行數百甚至數千個 epoch，讓模型有時間學習新的行为。这可以視为：把基礎模型版本中偶爾才會奏效的正向行为，經過 RLVR 强化为穩健的行为。

**语言模型 RL 训练的適用範圍持續扩大**：從根本的科學層面來看，o1 与 R1 帶來的最大啟示是——我們擁有了更多方法，可以把语言模型训练出潛在有價值的行为。研究者与工程師可用的門路越多，我們就越应该對 AI 的整體發展軌跡感到樂觀。

## 7.3 理解推理训练方法（Understanding Reasoning Training Methods）

對推理的投資，促成了「如何训练模型遵循人類指令」这門技藝的一次重大演進。这些训练配方仍然使用前面章节討論過的常見組件（如第 3 章對 DeepSeek R1 配方的概述所述），包括指令微调（instruction fine-tuning）、基于人類反馈的强化學習，以及可验证奖励强化學習（RLVR）。核心的變化在于使用多得多的 RLVR，并以不同的順序應用其他训练技術——傳統上，對推理模型而言，核心的训练步驟要嘛是一次大規模的 RL 训练，要嘛是在另一個已经歷大量 RLVR 训练的模型的*輸出*上进行大規模指令微调（稱为蒸馏 distillation）。

### 7.3.1 OpenAI o1 与 DeepSeek R1 之前的推理研究（Reasoning Research Before OpenAI o1 or DeepSeek R1）

在推理模型起飛之前，學界已投入大量心力研究如何训练语言模型在可验证領域上表現更好。下列这些工作的主要差異在于：它們的方法論未能扩展到 DeepSeek R1 及後續模型所使用的規模，或者它們產出的模型犧牲了整體效能，以換取更高的數學或程式撰寫能力。这裡納入其背後的想法与動機，是为了描繪出推理模型如何在整個領域版圖中誕生的更完整圖像。

在可验证領域上训练语言模型的最早嘗試，包括自學推理器（self-taught reasoner, STaR）系列工作 [160] [161] 与 TRICE [162]，兩者都在 2022 至 2023 年間使用標準答案奖励訊號來鼓勵模型进行思維鏈推理。STaR 實質上是對策略梯度（policy gradient）算法的近似，但在实务上以不同方式過濾樣本，并使用交叉熵（cross-entropy）度量而非對數機率（log-probability）；Quiet-STaR 則在此基礎上扩展，其想法与近期的推理模型非常相近——讓模型在嘗試回答可验证問題之前先生成 token（这有助于训练效果）。TRICE [162] 也透過生成推理軌跡（traces），再以一種受馬可夫鏈蒙地卡羅（Markov chain Monte Carlo）啟發的客製化期望最大化（expectation maximization）算法进行优化，來改善推理。VinePPO [163] 接續这些工作，採用了更貼近現代推理模型的设置。VinePPO 使用以 PPO 为基礎的算法，以數學題正確与否作为二元奖励，在 GSM8K 与 MATH 上训练。其他在 OpenAI o1 与 DeepSeek R1 之前的工作，則使用程式碼執行作为训练的反馈訊號 [164], [165]，或使用定理證明的验证（在該文中稱为「验证器反馈强化學習」Reinforcement Learning from Verifier Feedback, RLVF）[166]。Tülu 3 在这些方法的基礎上更進一步，使用一個簡單的 PPO 训练器來奖励答案正確的完成文本——最重要的是，同时維持模型在廣泛評測套件上的整體效能。Tülu 3 与現代推理训练技術的二元奖励，可以与 STaR 的迭代式方法或 Quiet-STaR 的對數概似（log-likelihood）奖励形成對比。

### 7.3.3 训练推理模型的常見实务（Common Practices in Training Reasoning Models）

在本節中，我們詳述在训练推理模型時，用于安排训练階段順序与调整数据以最大化效能的常見方法。

請注意，这些論文可能使用了某項列出的技術卻未提及，而它們的同儕則有提及；因此这些例子只是已知实现的一個子集，應作为參考，而非對最佳配方的最終定論。

- **離線難度過濾（Offline difficulty filtering）**：RLVR 的一個核心直覺是，模型只能從存在梯度的范例中學習。如果 RLVR 的起始模型對某個問題的解題率是 100% 或 0%，那麼針對該提示的不同完成文本之間就不會有梯度（也就是說，對策略梯度算法而言，所有策略看起来都一樣）。許多模型在開始大規模 RL 之前會使用難度過濾，将训练問題限縮在起始模型解題率僅为 20–80% 的那些題目。收集这種数据的方式是：對训练集中的每個提示取樣 N 個（例如 16 個）完成文本，并验证其中正確的比例。Seed-Thinking 1.5、Open Reasoner Zero、Phi 4、INTELLECT-2、MiMo RL、Skywork OR-1 等模型都使用了此方法的各種變體。
- **逐批次線上過濾（Per-batch online filtering）**（或貫穿训练全程的難度課程 difficulty curriculums）：在以離線過濾找出合適训练問題之外，另一個重要問題是：在學習過程中，問題应该以什么順序呈現給模型？为了解決这个問題，許多模型會對批次（batch）中的問題进行線上過濾、使用預先建構的課程／数据排程器（data schedulers）、将較難的問題留到训练後期，或採用其他改善長期稳定性的做法。Kimi 1.5、Magistral、Llama-Nemotron、INTELLECT-2、MiMo-RL、Hunyuan-TurboS 等模型使用了相關的想法。
- **移除 KL 懲罰（Remove KL penalty）**：隨着推理模型的 RL 训练長度（無論以何種指標計算——總 GPU 小時數、FLOPS 或 RL 步數）相較于 RLHF 训练大幅增加，加上奖励函數變得較不容易被过度优化，許多模型移除了 KL 懲罰——該懲罰原本用于約束 RL 學到的策略必須与训练起點的基礎模型保持相似。移除後，模型在训练過程中得以進一步探索。RAGEN [185]、Magistral、OpenReasonerZero、Skywork OR-1 等模型採用了这个做法。
- **放寬策略梯度裁剪（Relaxed policy-gradient clipping）**：GRPO 算法的新變體（例如 DAPO [129]）提出對 GRPO（或 PPO）所用的雙邊裁剪目標函數进行修改，以促進更好的探索。研究也显示，當奖励不完美時，裁剪可能造成虛假的學習訊號 [186]。这種在不同梯度方向使用不同範圍的雙邊裁剪，被 RAGEN、Magistral、INTELLECT-2 等模型採用。
- **離策略数据（或完全非同步更新）（Off-policy data (or fully asynchronous updates)）**：隨着問題變難，用 RL 解題所需的完成文本長度急遽增加（尤其是回應長度的*变异數*——經常出現長度極長的離群值），RL 训练中的运算資源可能因此閒置。为了解決这个問題，训练正朝着非同步更新，或改變問題編排進批次的方式來提升整體吞吐量的方向發展。Seed-Thinking 1.5、INTELLECT-2 等模型使用了從部分到完全非同步的（離策略 off-policy）数据。
- **額外的格式奖励（Additional format rewards）**：为了讓推理過程可預測，許多模型會加入小額奖励，確保模型在回答前遵循正確的格式，例如 `<think>...</think>`。DeepSeek R1、OpenReasonerZero、Magistral、Skywork OR-1 等模型使用了这个做法。
- **語言一致性奖励（Language consistency rewards）**：与格式奖励類似，一些多語言推理模型使用語言一致性奖励，優先鼓勵在推理過程中不切換語言的模型（以帶來更好、更可預測的使用者体验）。DeepSeek R1、Magistral 等模型屬于此類。
- **長度懲罰（Length penalties）**：許多模型在 RL 训练期間使用各種形式的長度懲罰，以隨時間稳定學習過程，或緩解在困難問題上的过度思考（overthinking）。例子包括 Kimi 1.5 逐步延長目標長度以對抗过度思考（同时在難度課程中維持高训练準確率），或 INTELLECT-2 全程施加小幅的長度懲罰。逐步延長训练序列長度可以緩解过度思考：先迫使模型在思考預算較有限的情況下學會有效推理，然后再過渡到更長的训练，讓模型能在更複雜的問題上有效率地運用这些行为。其他模型則使用超長過濾（overlong filtering）及其他相關实现來提升吞吐量。
- **損失正規化（Loss normalization）**：關于原始 GRPO 算法的逐群組（per-group）正規化項可能引入長度或難度偏差，已有一些討論（見策略梯度章节或 [118]）。因此，一些模型（例如 Magistral 或 MiMo）选择在批次層級而非群組層級對損失或優勢（advantages）进行正規化。
- **平行测试時运算扩展（Parallel test-time compute scaling）**：結合多個平行、獨立取樣的推演（rollouts）所产生的答案，相較于只使用單一推演的答案，可以帶來顯着的改善。最簡單樸素的平行测试時运算扩展形式（DeepSeek-R1、Phi-4 等模型採用的做法），是把多數推演回傳的答案當作最終答案。更進階的技術是使用一個經過训练的評分模型，從平行推演的答案中挑選最佳答案。截至 2026 年，这項技術尚未在公開、有文件記錄的推理模型配方中普及，但它曾在 Claude 4 的發布公告中被提及 [187]，并在 DeepSeek-GRM [157] 中被使用。

在这些常見技術之外，關于推理训练如何在不犧牲附帶能力的前提下打造出有用的模型，也有許多常見的發現：

- **純文字推理训练可提升多模態效能（Text-only reasoning boosts multimodal performance）**：Magistral、MiMo-VL 等發現，先训练一個多模態模型，然后在多模態训练之后进行純文字的推理训练，可以*提升*最終模型的多模態效能。
- **透過系统提示切換推理（或長度控制）（Toggleable reasoning with system prompt (or length control)）**：Llama-Nemotron、Nemotron Nano、Qwen 3、SmolLM 3 等使用特定的系统提示（system prompts）（可能搭配長度受控的 RL 训练 [188]），讓使用者可以開關思考長度。其他開放模型，例如 OpenAI 的 GPT-OSS 与 LLM360 的 K2-V2 [182]，則採用在系统提示中设置低—中—高推理強度（reasoning effort）的做法，但这類行为的训练方法目前還没有那麼完善的文件記錄。

## 7.4 展望未來（Looking Ahead）

推理模型的版圖正以近年 AI 研究中任何領域都未曾有過的速度演進，本章列出的一些常見实务，終将不可避免地被新技術取代。

目前已有數項工作正在进行，試圖系统性地理解推理训练为何有效。Olmo 3 Think [18] 是對推理模型完整训练生命週期最全面的開放文件記錄，为研究社群提供了每個階段的检查點与数据以供研究，并以一場在 220 顆 GPU 上長達近 4 週的训练作結。同樣地，關于理解 RL 用于推理的扩展特性的研究 [17]，也開始将运算、数据与效能之間的關係形式化——这些關係过去只存在于实务工作者的直覺之中。

可以確定的是，强化學習已经從蛋糕比喻中的「頂端櫻桃」，畢業成为前沿模型训练中承重的核心組件。本章圍繞 RLVR 概念的各項小技術——難度過濾、格式奖励等等——并非最終答案，但它們代表了这个領域目前對「如何從语言模型中引出推理」的最佳理解。下一代的方法很可能看起来會不一樣，但它們将建立在此處奠定的基礎之上。
